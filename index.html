<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<script>try{const r=localStorage.getItem('sf_red');if(r==='1'||r==='2'){document.documentElement.classList.add('red');if(r==='2')document.documentElement.classList.add('dim');document.getElementById('themeColor').content='#000000'}}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<title>STAR STORY · ตำนานดาว</title>
<meta name="apple-mobile-web-app-title" content="STAR STORY">
<style>
:root{--bg:#050b18;--panel:rgba(9,18,35,.88);--line:#27405f;--gold:#ffd98a;--cyan:#7cc8ff;--muted:#9fb3cc;--text:#eef4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:0}
body.cam #camera{display:block}
#sky{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;z-index:1}
.reticle{position:fixed;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border:1.5px solid rgba(124,200,255,.85);border-radius:50%;pointer-events:none;z-index:2}
.reticle:before,.reticle:after{content:"";position:absolute;background:rgba(124,200,255,.85)}
.reticle:before{left:50%;top:-12px;bottom:-12px;width:1.5px;margin-left:-.75px}
.reticle:after{top:50%;left:-12px;right:-12px;height:1.5px;margin-top:-.75px}
.top{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:center;pointer-events:none;z-index:3}
.pill{background:rgba(5,11,24,.74);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
.pill b{color:var(--gold)}
#redBtn{position:absolute;right:0;top:0;pointer-events:auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(5,11,24,.74);font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.top .pill{max-width:calc(100% - 96px);white-space:normal;text-align:center;line-height:1.35;border-radius:18px}
/* ---- Red Night Mode: ชั้นกรองแสงที่ตัดสีเขียว/น้ำเงินออกทั้งหมด เหลือแต่แสงแดง ---- */
#redFilter{position:fixed;inset:0;z-index:1000;pointer-events:none;display:none;background:#ff0000;mix-blend-mode:multiply}
html.red #redFilter{display:block}
html.red.dim #redFilter{background:#8a0000}
html.red,html.red body{background:#000}
html.red #camera{filter:grayscale(1) brightness(.7)}
html.red #redBtn{background:#3a0000;border-color:#ff4040}
html.red .btn.on,html.red #stSpeak.playing,html.red #startBtn{background:#5a0000;color:#fff;border-color:#a00}
#langBtn{position:absolute;left:0;top:0;pointer-events:auto;min-width:38px;height:38px;padding:0 8px;border-radius:19px;border:1px solid var(--line);background:rgba(5,11,24,.74);color:var(--text);font-size:13px;font-weight:700;cursor:pointer}
.langSeg{display:flex;gap:6px;margin-bottom:22px}
.langSeg button{background:rgba(19,40,74,.8);color:var(--text);border:1px solid #33507a;border-radius:99px;padding:7px 14px;font-size:14px;cursor:pointer}
.langSeg button.on{background:#e7bd70;color:#14213a;border-color:#e7bd70;font-weight:700}
html.red .langSeg button.on{background:#5a0000;color:#fff;border-color:#a00}
#introRed{margin-top:10px;background:none;border:1px solid #6a2a2a;color:#ff8080;border-radius:12px;padding:8px 14px;font-size:14px;cursor:pointer}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 56px);transform:translateX(-50%);background:rgba(231,189,112,.95);color:#14213a;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;z-index:5;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:6px 14px calc(env(safe-area-inset-bottom) + 12px);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);max-width:720px;margin:0 auto}
.grab{width:100%;padding:6px 0 8px;cursor:pointer}.grab i{display:block;width:40px;height:4px;border-radius:4px;background:#4a6688;margin:0 auto}
.kicker{font-size:11px;color:var(--muted);letter-spacing:.04em}
#conName{font-size:20px;font-weight:700;color:var(--gold);line-height:1.3}
#conSub{font-size:12px;color:var(--muted);margin-top:2px}
#lore{font-size:13px;line-height:1.55;margin:6px 0 0;color:#d6e2f3}
.sheet.min .more{display:none}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
select,button,input{font:inherit}
select{flex:1;min-width:0;background:#0a1830;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 8px;font-size:14px}
.btn{background:#13284a;color:var(--text);border:1px solid #33507a;border-radius:10px;padding:9px 10px;font-size:13px;white-space:nowrap;cursor:pointer}
.btn.on{background:#e7bd70;color:#14213a;border-color:#e7bd70;font-weight:600}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
#guide{font-size:15px;text-align:center;padding:9px;border:1px dashed #3f5d80;border-radius:10px;margin-top:8px;display:none;line-height:1.5}
#guide.found{border-color:#7be0a0;color:#9ff0bd}
#guide small{display:block;font-size:12px;color:var(--muted)}
.timebox{display:none;gap:8px;align-items:center;margin-top:10px;font-size:13px}.timebox.show{display:flex}
input[type=range]{flex:1;accent-color:#e7bd70}
#status{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
#status.warn{color:#ffb38a}
#intro{position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at 50% 30%,#14305a 0%,#050b18 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
#intro h1{font-size:30px;margin:0 0 6px;letter-spacing:.06em}#intro h1 span{color:var(--gold)}
#intro p{color:var(--muted);font-size:14px;line-height:1.6;max-width:360px;margin:6px 0}
#startBtn{margin-top:22px;background:#e7bd70;color:#14213a;border:0;border-radius:14px;padding:15px 30px;font-size:17px;font-weight:700;cursor:pointer}
#noSensorBtn{margin-top:12px;background:none;border:0;color:var(--cyan);font-size:14px;text-decoration:underline;cursor:pointer}
#introWarn{color:#ffb38a !important}
.headrow{display:flex;align-items:flex-start;gap:10px}.headrow>div{flex:1;min-width:0}
#storyBtn{flex:none;margin-top:12px}
.story{position:fixed;left:0;right:0;bottom:0;z-index:8;max-width:720px;margin:0 auto;max-height:78vh;display:flex;flex-direction:column;background:#0c162a;border-top:1px solid #4a6688;border-radius:20px 20px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);box-shadow:0 -10px 40px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .3s ease}
.story.open{transform:none}
.storyHead{display:flex;gap:10px;align-items:flex-start}.storyHead>div{flex:1;min-width:0}
#stTitle{font-size:20px;margin:2px 0;color:var(--gold);line-height:1.35}
#stSub{font-size:12px;color:var(--muted)}
#stClose{background:#1b3156;border:1px solid #3b5a85;color:var(--text);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;flex:none}
#stBody{overflow-y:auto;-webkit-overflow-scrolling:touch;margin:10px 0;font-size:16px;line-height:1.85;color:#e3ecf8;-webkit-user-select:text;user-select:text}
#stBody span{border-radius:6px;padding:1px 2px;transition:background .2s,color .2s}
#stBody span.reading{background:rgba(231,189,112,.25);color:#fff4d8}
.storyBtns{display:flex;gap:8px}.storyBtns .btn{flex:1;padding:12px;font-size:15px}
#stSpeak.playing{background:#ff9d7a;border-color:#ff9d7a;color:#2a1208}
#stRate{flex:0 0 auto !important}
#stVoiceNote{font-size:11px;color:#ffb38a;margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="sky"></canvas>
<div class="reticle"></div>
<div class="top"><button id="langBtn" data-i18n-aria="langAria">TH</button><span class="pill" id="dirPill" data-i18n="dirInit">กำลังเตรียมท้องฟ้า…</span><button id="redBtn" data-i18n-aria="redAria" title="Red Night Mode">🔴</button></div>
<div id="toast"></div>

<div class="sheet" id="sheet">
  <div class="grab" id="grab"><i></i></div>
  <div class="headrow"><div>
    <div class="kicker" data-i18n="kicker">กำลังชี้ไปที่กลุ่มดาว</div>
    <div id="conName">—</div>
    <div id="conSub">—</div>
  </div><button class="btn" id="storyBtn" data-i18n="storyBtn">📖 ตำนาน</button></div>
  <div class="row"><select id="target" aria-label="เลือกเป้าหมาย"></select></div>
  <div id="guide"></div>
  <div class="more">
    <p id="lore"></p>
    <div class="btns">
      <button class="btn" id="camBtn" data-i18n="cam">📷 AR</button>
      <button class="btn" id="sensorBtn" data-i18n="sensor">🧭 เซนเซอร์</button>
      <button class="btn" id="timeBtn" data-i18n="time">🕘 เวลา</button>
      <button class="btn" id="gridBtn" data-i18n="grid">▦ เส้นกริด</button>
    </div>
    <div class="timebox" id="timebox"><input type="range" id="timeRange" min="-720" max="720" step="10" value="0"><span id="timeLabel">ตอนนี้</span><button class="btn" id="nowBtn" data-i18n="now">ตอนนี้</button></div>
    <div id="status"></div>
  </div>
</div>

<div class="story" id="story" aria-hidden="true">
  <div class="storyHead"><div><div class="kicker" data-i18n="storyKicker">📖 ตำนานดาว</div><h2 id="stTitle"></h2><div id="stSub"></div></div><button id="stClose" data-i18n-aria="close">✕</button></div>
  <div id="stBody"></div>
  <div class="storyBtns"><button class="btn" id="stSpeak">🔊 อ่านออกเสียง</button><button class="btn" id="stRate">ช้า</button><button class="btn" id="stFind" data-i18n="find">🎯 หาบนฟ้า</button></div>
  <div id="stVoiceNote"></div>
</div>

<div id="intro">
  <div class="langSeg"><button data-lang="th">ไทย</button><button data-lang="en">English</button><button data-lang="zh">中文</button></div>
  <h1>✨ STAR <span>STORY</span></h1>
  <p data-i18n-html="intro1">ยกมือถือขึ้นฟ้า แล้วหมุนไปรอบ ๆ แอปจะใช้ <b>GPS + เวลา + เข็มทิศ + ไจโร</b> คำนวณว่าคุณกำลังชี้ไปที่กลุ่มดาวอะไร</p>
  <p data-i18n-html="intro2">เมื่อกดเริ่ม เบราว์เซอร์จะขอสิทธิ์ <b>Motion &amp; Orientation</b> และ <b>Location</b> — กด “อนุญาต” ทั้งสองอย่าง</p>
  <p id="introWarn"></p>
  <button id="startBtn" data-i18n="start">เริ่มส่องดาว</button>
  <button id="noSensorBtn" data-i18n="noSensor">ใช้แบบลากนิ้ว (ไม่ใช้เซนเซอร์)</button>
  <button id="introRed">🔴 เปิดโหมดแสงแดง (ถนอมสายตาตอนกลางคืน)</button>
</div>

 'เหล่าเทพนำทั้งนายพรานและแมงป่องขึ้นไปไว้บนท้องฟ้า แต่ให้อยู่คนละฟากกัน',
 'เมื่อกลุ่มดาวแมงป่องขึ้นทางทิศตะวันออก กลุ่มดาวนายพรานก็จะลับขอบฟ้าไปทางทิศตะวันตก ทั้งคู่จึงแทบไม่เคยปรากฏบนฟ้าพร้อมกันอีกเลย',
 'ส่วนคนไทยมองดาวสามดวงที่เป็นเข็มขัด กับดาวที่เรียงต่อลงมา เป็นรูป “ดาวไถ” เหมือนคันไถของชาวนา',
 'ลองสังเกตดาวบีเทลจุสสีส้มแดงที่ไหล่ และดาวไรเจลสีขาวอมฟ้าที่เท้า สีที่ต่างกันบอกเราว่าดาวสองดวงนี้ร้อนไม่เท่ากัน']},
SCORPIUS:{t:'แมงป่องผู้ไล่ล่านายพราน',p:[
 'ในตำนานกรีก แมงป่องตัวนี้คือแมงป่องยักษ์ที่พระแม่ธรณีไกอาส่งมาหยุดนายพรานโอไรออน ผู้คุยโวว่าจะล่าสัตว์ทุกตัวบนโลก',
 'แมงป่องต่อยโอไรออนจนสิ้นใจ เหล่าเทพจึงยกทั้งคู่ขึ้นฟ้า แต่วางไว้คนละฟาก',
 'ทุกวันนี้ เมื่อแมงป่องโผล่ขึ้นทางทิศตะวันออก นายพรานจะลับขอบฟ้าไปทางทิศตะวันตก ราวกับยังหนีแมงป่องอยู่',
 'หัวใจของแมงป่องคือดาวแอนทาเรส ดาวยักษ์สีแดง ชื่อนี้แปลว่า “คู่แข่งของดาวอังคาร” เพราะมีสีแดงคล้ายกัน',
 'ในประเทศไทย กลุ่มดาวแมงป่องเห็นชัดทางทิศใต้ช่วงหัวค่ำเดือนพฤษภาคมถึงสิงหาคม ลองมองหาหางที่โค้งเป็นตะขอ']},
UMA:{t:'คาลลิสโต แม่หมีบนท้องฟ้า',p:[
 'ในตำนานกรีก คาลลิสโตเป็นนางไม้ผู้งดงาม มีบุตรชายกับเทพซุสชื่ออาร์คัส',
 'เทพีเฮรา มเหสีของซุส ริษยาจึงสาปคาลลิสโตให้กลายเป็นหมี นางต้องเร่ร่อนอยู่ในป่าเพียงลำพัง',
 'หลายปีต่อมา อาร์คัสเติบโตเป็นนายพราน วันหนึ่งเขาพบหมีตัวหนึ่งในป่าและกำลังจะยิงธนู โดยไม่รู้เลยว่าหมีตัวนั้นคือแม่ของตน',
 'ซุสเห็นเข้าจึงเปลี่ยนอาร์คัสให้เป็นหมีตัวเล็ก แล้วคว้าหางหมีทั้งสองเหวี่ยงขึ้นไปบนฟ้า หางของหมีบนฟ้าจึงยาวกว่าหมีจริง ๆ',
 'ส่วนคนไทยมองดาวเจ็ดดวงที่เรียงเป็นรูปกระบวยว่าเป็น “ดาวจระเข้”',
 'เคล็ดลับ ลากเส้นต่อจากดาวสองดวงที่ปลายกระบวยออกไปประมาณห้าเท่าของระยะห่าง จะพบดาวเหนือ']},
UMI:{t:'ลูกหมีกับดาวเหนือ',p:[
 'ตามตำนานกรีก หมีเล็กคืออาร์คัส บุตรชายของคาลลิสโต ซุสเปลี่ยนเขาเป็นหมีแล้วยกขึ้นไปอยู่ใกล้แม่บนท้องฟ้า',
 'ปลายหางของหมีเล็กคือดาวเหนือ หรือโพลาริส ซึ่งอยู่เกือบตรงขั้วฟ้าเหนือพอดี',
 'ขณะที่ดาวดวงอื่นหมุนไปรอบท้องฟ้าตลอดคืน ดาวเหนือแทบไม่ขยับเลย นักเดินทางและนักเดินเรือจึงใช้ดาวเหนือบอกทิศเหนือมาหลายร้อยปี',
 'ความสูงของดาวเหนือจากขอบฟ้าเท่ากับละติจูดของผู้สังเกต ที่กรุงเทพฯ จึงเห็นดาวเหนืออยู่ต่ำ ประมาณ 14 องศา ต้องมองทางทิศเหนือในที่ที่ไม่มีตึกบัง']},
LYRA:{t:'พิณของออร์เฟียส และเจ้าหญิงทอผ้า',p:[
 'ในตำนานกรีก ออร์เฟียสเป็นนักดนตรีที่เก่งที่สุดในโลก เมื่อเขาดีดพิณ แม้แต่ต้นไม้และก้อนหินยังโอนเอนตามเสียงเพลง',
 'วันหนึ่ง ยูริไดซี ภรรยาที่เขารักถูกงูกัดจนเสียชีวิต ออร์เฟียสจึงเดินทางลงไปยังยมโลก',
 'เขาดีดพิณจนเทพเฮดีสผู้ครองยมโลกใจอ่อน ยอมให้พาภรรยากลับ แต่มีข้อแม้ว่าห้ามหันหลังกลับไปมองจนกว่าจะถึงโลกมนุษย์',
 'เมื่อเกือบถึงทางออก ออร์เฟียสอดใจไม่ไหวหันไปมอง ยูริไดซีจึงหายกลับไปยังยมโลกตลอดกาล',
 'หลังจากออร์เฟียสสิ้นชีวิต เหล่าเทพจึงนำพิณของเขาขึ้นไปไว้บนท้องฟ้า',
 'ส่วนในตำนานจีน ดาวเวกาคือเจ้าหญิงทอผ้าแห่งสวรรค์ ผู้ตกหลุมรักหนุ่มเลี้ยงวัว ซึ่งก็คือดาวอัลแทร์',
 'ทั้งคู่ถูกทางช้างเผือกกั้นไว้คนละฝั่ง และได้พบกันเพียงปีละครั้ง ในคืนวันที่เจ็ด เดือนเจ็ด ตามปฏิทินจันทรคติ เมื่อฝูงนกบินมาต่อตัวกันเป็นสะพานข้ามทางช้างเผือก']},
AQUILA:{t:'นกอินทรีของซุส และหนุ่มเลี้ยงวัว',p:[
 'ในตำนานกรีก นกอินทรีตัวนี้เป็นสัตว์คู่ใจของเทพซุส มีหน้าที่ถือสายฟ้าอันทรงพลังให้ซุส',
 'ครั้งหนึ่งซุสส่งนกอินทรีลงมายังโลก ไปรับเด็กหนุ่มเลี้ยงแกะชื่อแกนีมีด ขึ้นไปเป็นผู้รินน้ำทิพย์ให้เหล่าเทพบนเขาโอลิมปัส',
 'ดาวที่สว่างที่สุดของกลุ่มนี้คือดาวอัลแทร์ ซึ่งในตำนานจีนคือหนุ่มเลี้ยงวัว คนรักของเจ้าหญิงทอผ้า หรือดาวเวกา',
 'ทั้งสองอยู่คนละฝั่งของทางช้างเผือก และได้พบกันเพียงปีละครั้งในคืนวันที่เจ็ด เดือนเจ็ด',
 'อัลแทร์ เวกา และเดเนบ รวมกันเป็นรูป “สามเหลี่ยมฤดูร้อน” ที่เห็นได้ชัดในช่วงหัวค่ำเดือนกรกฎาคมถึงตุลาคม']},
CYGNUS:{t:'หงส์ผู้ภักดี',p:[
 'ในตำนานกรีก ฟีทอนเป็นบุตรของเทพแห่งดวงอาทิตย์ เขาขอยืมรถม้าเทียมดวงอาทิตย์ไปขับ แต่ควบคุมม้าไม่ได้ ซุสจึงต้องใช้สายฟ้าฟาด ฟีทอนตกลงไปในแม่น้ำอีริดานัส',
 'ไซกนัส เพื่อนรักของฟีทอน ดำน้ำลงไปค้นหาร่างเพื่อนครั้งแล้วครั้งเล่าอย่างไม่ยอมแพ้',
 'เหล่าเทพสงสารในความภักดี จึงเปลี่ยนไซกนัสให้เป็นหงส์ และนำขึ้นไปไว้บนท้องฟ้า',
 'กลุ่มดาวหงส์บินอยู่บนแนวทางช้างเผือกพอดี บางครั้งจึงเรียกว่า “กางเขนเหนือ” เพราะดาวเรียงเป็นรูปไม้กางเขน',
 'หางของหงส์คือดาวเดเนบ ดาวยักษ์ที่อยู่ไกลมาก แต่ยังสว่างจนเรามองเห็นได้ด้วยตาเปล่า']},
TAURUS:{t:'วัวขาวของซุส และดาวลูกไก่',p:[
 'ในตำนานกรีก ซุสแปลงกายเป็นวัวขาวผู้อ่อนโยน เพื่อเข้าใกล้เจ้าหญิงยุโรปาที่กำลังเล่นอยู่ริมทะเล',
 'เมื่อเจ้าหญิงขึ้นไปนั่งบนหลัง วัวขาวก็ว่ายน้ำข้ามทะเลไปยังเกาะครีต ชื่อทวีปยุโรปมาจากชื่อของเจ้าหญิงองค์นี้',
 'ตาของวัวคือดาวอัลเดบารันสีส้ม ส่วนบนหลังวัวมีกระจุกดาวเล็ก ๆ ที่คนไทยเรียกว่า “ดาวลูกไก่”',
 'ตำนานไทยเล่าว่า ตายายคู่หนึ่งเลี้ยงแม่ไก่กับลูกเจี๊ยบไว้ วันหนึ่งมีพระธุดงค์มาพักที่หมู่บ้าน ตายายไม่มีอะไรจะทำอาหารถวาย จึงคิดจะฆ่าแม่ไก่',
 'แม่ไก่รู้ก็ร่ำลาลูก ๆ ด้วยความเศร้า เมื่อแม่ไก่ถูกฆ่า ลูกไก่ทั้งหกตัวก็กระโดดเข้ากองไฟตามแม่ไปด้วยความรัก',
 'เทวดาเห็นความกตัญญู จึงนำแม่ไก่และลูกไก่ขึ้นไปเป็นดาวลูกไก่บนท้องฟ้า ให้อยู่ด้วยกันตลอดไป']},
CMA:{t:'สุนัขของนายพราน และดาวที่สว่างที่สุด',p:[
 'ในตำนานกรีก สุนัขใหญ่คือสุนัขล่าเนื้อคู่ใจของนายพรานโอไรออน มันวิ่งตามเจ้านายไปบนท้องฟ้าทุกคืน',
 'อีกตำนานเล่าถึงสุนัขชื่อไลแลปส์ ที่ไม่มีเหยื่อตัวใดหนีพ้น มันถูกส่งไปไล่จับสุนัขจิ้งจอกที่ไม่มีใครจับได้',
 'การไล่ล่านี้ไม่มีวันจบ ซุสจึงเปลี่ยนทั้งคู่ให้กลายเป็นหิน แล้วนำสุนัขขึ้นไปไว้บนท้องฟ้า',
 'ที่ปากของสุนัขคือดาวซิริอุส ดาวฤกษ์ที่สว่างที่สุดบนท้องฟ้ายามค่ำคืน อยู่ห่างจากโลกประมาณ 8.6 ปีแสง',
 'ชาวอียิปต์โบราณสังเกตว่า เมื่อดาวซิริอุสโผล่ขึ้นก่อนดวงอาทิตย์ในยามเช้า แม่น้ำไนล์ก็ใกล้ถึงฤดูน้ำหลาก',
 'เคล็ดลับ ลากเส้นจากเข็มขัดนายพรานลงไปทางซ้าย จะพบดาวซิริอุส']},
CMI:{t:'สุนัขตัวเล็กของนายพราน',p:[
 'สุนัขเล็กเป็นสุนัขอีกตัวหนึ่งของนายพรานโอไรออน คอยวิ่งตามอยู่ไม่ห่างจากสุนัขใหญ่',
 'ดาวดวงเด่นคือโพรซีออน ชื่อนี้แปลว่า “ก่อนสุนัข” เพราะมักโผล่ขึ้นจากขอบฟ้าก่อนดาวซิริอุสของสุนัขใหญ่เล็กน้อย',
 'โพรซีออน ซิริอุส และบีเทลจุส รวมกันเป็นรูป “สามเหลี่ยมฤดูหนาว” ที่เห็นชัดในช่วงหัวค่ำเดือนธันวาคมถึงมีนาคม']},
GEMINI:{t:'ฝาแฝดผู้ไม่ยอมพรากจากกัน',p:[
 'ในตำนานกรีก แคสเตอร์และพอลลักซ์เป็นพี่น้องฝาแฝดที่รักกันมาก แคสเตอร์เป็นมนุษย์ธรรมดา ส่วนพอลลักซ์เป็นบุตรของซุสจึงเป็นอมตะ',
 'ทั้งคู่ออกผจญภัยด้วยกันเสมอ รวมถึงร่วมเดินทางไปกับเรืออาร์โกเพื่อตามหาขนแกะทองคำ',
 'เมื่อแคสเตอร์ถูกสังหารในการต่อสู้ พอลลักซ์เศร้าโศกมาก จึงขอให้ซุสแบ่งความเป็นอมตะของตนให้พี่ชาย',
 'ซุสซาบซึ้งในความรักของพี่น้อง จึงนำทั้งสองขึ้นไปอยู่เคียงกันบนท้องฟ้าตลอดไป',
 'ชาวเรือในสมัยโบราณนับถือฝาแฝดคู่นี้เป็นผู้คุ้มครองการเดินเรือ',
 'มองหาดาวสว่างสองดวงที่อยู่ใกล้กัน นั่นคือหัวของฝาแฝดทั้งสอง']},
LEO:{t:'สิงโตแห่งนีเมีย',p:[
 'ในตำนานกรีก สิงโตแห่งนีเมียเป็นสัตว์ร้ายที่มีหนังเหนียวมาก ดาบ หอก หรือลูกธนูก็ทำอะไรมันไม่ได้',
 'เฮอร์คิวลีส วีรบุรุษผู้แข็งแรงที่สุด ได้รับภารกิจแรกในสิบสองภารกิจให้ปราบสิงโตตัวนี้',
 'เมื่ออาวุธใช้ไม่ได้ผล เฮอร์คิวลีสจึงเข้าปล้ำและรัดคอสิงโตด้วยมือเปล่าจนสำเร็จ แล้วนำหนังของมันมาสวมเป็นเกราะ',
 'เทพีเฮราจึงนำสิงโตขึ้นไปไว้บนท้องฟ้า',
 'หัวของสิงโตเป็นรูปเคียว คล้ายเครื่องหมายคำถามกลับด้าน ดาวสว่างที่ปลายเคียวคือดาวเรกูลัส แปลว่า “ราชาน้อย”']},
VIRGO:{t:'เทพีแห่งการเก็บเกี่ยวและฤดูกาล',p:[
 'ชาวกรีกเชื่อมโยงกลุ่มดาวหญิงสาวกับเทพีดีมิเทอร์ เทพีแห่งการเพาะปลูก และเพอร์เซโฟนีธิดาของนาง',
 'วันหนึ่งเทพเฮดีสผู้ครองยมโลกลักพาเพอร์เซโฟนีไปเป็นมเหสี ดีมิเทอร์โศกเศร้าจนพืชพันธุ์ทั่วโลกเหี่ยวเฉา',
 'ซุสจึงสั่งให้เฮดีสคืนเพอร์เซโฟนี แต่เพราะนางกินเมล็ดทับทิมในยมโลกไปแล้ว นางจึงต้องกลับไปอยู่ยมโลกปีละช่วงหนึ่ง',
 'ช่วงที่ลูกสาวจากไป ดีมิเทอร์เศร้า โลกจึงหนาวเย็นเป็นฤดูหนาว เมื่อลูกกลับมา ดอกไม้ก็บานเป็นฤดูใบไม้ผลิ',
 'ดาวสว่างของกลุ่มนี้คือดาวสไปกา แปลว่า “รวงข้าว” ที่หญิงสาวถืออยู่ในมือ']},
BOOTES:{t:'ผู้ไล่ต้อนหมี',p:[
 'กลุ่มดาวคนเลี้ยงสัตว์มีรูปร่างคล้ายว่าวหรือกรวยไอศกรีม ชาวกรีกมองว่าเป็นชายที่คอยไล่ต้อนหมีใหญ่ให้หมุนรอบขั้วฟ้าเหนือไม่หยุด',
 'ดาวดวงเด่นคืออาร์คทูรัส ชื่อนี้แปลว่า “ผู้เฝ้าหมี” เป็นดาวยักษ์สีส้มที่สว่างเป็นอันดับสี่ของท้องฟ้ายามค่ำคืน',
 'เคล็ดลับ ลากเส้นโค้งต่อจากด้ามกระบวยของหมีใหญ่ออกไป จะพบอาร์คทูรัส แล้วโค้งต่อไปอีกจะถึงดาวสไปกาในกลุ่มดาวหญิงสาว']},
SGR:{t:'คนครึ่งม้านักแม่นธนู',p:[
 'ชาวกรีกมองกลุ่มดาวนี้เป็นคนครึ่งม้าที่กำลังน้าวคันธนู ลูกศรเล็งไปที่ดาวแอนทาเรส หัวใจของแมงป่อง ราวกับคอยปกป้องท้องฟ้าจากแมงป่องตัวนั้น',
 'ปัจจุบันคนนิยมมองดาวสว่างของกลุ่มนี้เป็นรูป “กาน้ำชา” มีทั้งพวยกา หูจับ และฝา',
 'ไอน้ำที่พวยพุ่งจากกาน้ำชาคือแสงฟุ้ง ๆ ของทางช้างเผือก เพราะทิศนี้ชี้ไปยังใจกลางดาราจักรของเรา',
 'ที่ใจกลางนั้นมีหลุมดำมวลยิ่งยวด ซึ่งมีมวลประมาณสี่ล้านเท่าของดวงอาทิตย์']},
PERSEUS:{t:'เพอร์ซิอัส ผู้ช่วยเจ้าหญิงแอนดรอเมดา',p:[
 'ในตำนานกรีก ราชินีแคสสิโอเปียคุยโวว่า ตนและเจ้าหญิงแอนดรอเมดาผู้เป็นธิดา งดงามกว่าเหล่านางไม้แห่งท้องทะเล',
 'เทพโพไซดอนโกรธมาก จึงส่งอสูรทะเลซีตัสมาอาละวาดทำลายบ้านเมือง',
 'พระราชาซีฟิอัสได้รับคำทำนายว่าต้องสังเวยแอนดรอเมดาให้อสูร เจ้าหญิงจึงถูกล่ามโซ่ไว้กับโขดหินริมทะเล',
 'ขณะนั้นวีรบุรุษเพอร์ซิอัสเพิ่งปราบเมดูซา นางปีศาจผมงูที่ใครสบตาจะกลายเป็นหิน เขาบินผ่านมาและเห็นเจ้าหญิงตกอยู่ในอันตราย',
 'เมื่ออสูรซีตัสโผล่ขึ้นจากทะเล เพอร์ซิอัสชูหัวเมดูซาขึ้น อสูรร้ายกลายเป็นหินทันที เขาช่วยแอนดรอเมดาไว้ได้ และทั้งคู่ก็แต่งงานกัน',
 'ม้าบินเพกาซัสถือกำเนิดขึ้นตอนที่เมดูซาถูกปราบ ตัวละครทั้งหมดในเรื่องนี้จึงอยู่ใกล้กันบนท้องฟ้า ทั้งราชา ราชินี เจ้าหญิง วีรบุรุษ ม้าบิน และอสูรทะเล',
 'ราชินีแคสสิโอเปียถูกลงโทษให้นั่งบนบัลลังก์หมุนรอบขั้วฟ้า บางเวลาจึงต้องห้อยหัวลง',
 'ส่วนดาวอัลกอลในกลุ่มดาวเพอร์ซิอัส ถูกมองว่าเป็นดวงตาของเมดูซา ความสว่างของมันจะหรี่ลงทุก ๆ ประมาณ 2.9 วัน']},
ARGO:{t:'เรืออาร์โก ตามหาขนแกะทองคำ',p:[
 'ในตำนานกรีก เจสันได้รับภารกิจให้ไปนำขนแกะทองคำกลับมา เพื่อทวงบัลลังก์ที่ถูกแย่งชิงไป',
 'เขาต่อเรือลำใหญ่ชื่ออาร์โก และรวบรวมวีรบุรุษราวห้าสิบคนร่วมเดินทาง เรียกว่าเหล่าอาร์โกนอต ในนั้นมีทั้งเฮอร์คิวลีส ออร์เฟียส และฝาแฝดแคสเตอร์กับพอลลักซ์',
 'พวกเขาฝ่าอันตรายมากมาย ทั้งหินยักษ์ที่กระแทกเข้าหากัน และมังกรที่ไม่เคยหลับซึ่งเฝ้าขนแกะทองคำ ก่อนจะทำภารกิจสำเร็จ',
 'เรืออาร์โกถูกนำขึ้นไปไว้บนท้องฟ้า เดิมเป็นกลุ่มดาวขนาดใหญ่มาก ต่อมานักดาราศาสตร์จึงแบ่งออกเป็นสามกลุ่ม คือ กระดูกงูเรือ ท้ายเรือ และใบเรือ',
 'ดาวคาโนปัสในกลุ่มกระดูกงูเรือ เป็นดาวที่สว่างเป็นอันดับสองของท้องฟ้า ในประเทศไทยจะเห็นอยู่ต่ำทางทิศใต้']},
ARIES:{t:'แกะขนทองคำ',p:[
 'ในตำนานกรีก เจ้าชายฟริกซัสและเจ้าหญิงเฮลลีถูกแม่เลี้ยงใจร้ายวางแผนกำจัด',
 'แกะวิเศษขนทองคำบินลงมาช่วย พาสองพี่น้องหนีข้ามทะเลไป ระหว่างทางเฮลลีพลัดตกลงไปในทะเล แต่ฟริกซัสไปถึงแดนโคลคิสได้อย่างปลอดภัย',
 'ขนแกะทองคำถูกแขวนไว้ในป่าศักดิ์สิทธิ์ มีมังกรเฝ้าไว้ จนกระทั่งเจสันและเหล่าอาร์โกนอตเดินทางมานำกลับไป',
 'ส่วนตัวแกะถูกนำขึ้นไปเป็นกลุ่มดาวแกะบนท้องฟ้า เป็นหนึ่งในกลุ่มดาวจักรราศี']},
HYDRA:{t:'งูไฮดราหลายหัว',p:[
 'ไฮดราเป็นงูน้ำยักษ์ที่มีหลายหัว ที่ร้ายกาจที่สุดคือ เมื่อตัดหัวหนึ่งออก จะงอกหัวใหม่ขึ้นมาสองหัว',
 'เฮอร์คิวลีสได้รับภารกิจให้ปราบไฮดรา เขาให้หลานชายชื่อไอโอลัสใช้คบไฟจี้รอยตัดทันที หัวใหม่จึงงอกไม่ได้ จนปราบไฮดราได้สำเร็จ',
 'ไฮดราเป็นกลุ่มดาวที่ใหญ่ที่สุดใน 88 กลุ่ม ทอดตัวยาวเกือบหนึ่งในสี่ของท้องฟ้า',
 'ดาวดวงเด่นคืออัลฟาร์ด แปลว่า “ผู้โดดเดี่ยว” เพราะไม่มีดาวสว่างดวงอื่นอยู่ใกล้เลย']},
CANCER:{t:'ปูผู้กล้าหาญ',p:[
 'ระหว่างที่เฮอร์คิวลีสต่อสู้กับงูไฮดรา เทพีเฮราผู้ไม่ชอบเฮอร์คิวลีสได้ส่งปูยักษ์มาหนีบเท้าเขา',
 'เฮอร์คิวลีสเหยียบปูจนแหลก แต่เฮรายกย่องความกล้าหาญของปู จึงนำมันขึ้นไปไว้บนท้องฟ้า',
 'ดาวในกลุ่มปูค่อนข้างจาง แต่ตรงกลางมีกระจุกดาวรังผึ้ง ที่มองเห็นเป็นฝ้าจาง ๆ ด้วยตาเปล่าในที่ที่มืดสนิท']},
HERCULES:{t:'เฮอร์คิวลีส วีรบุรุษสิบสองภารกิจ',p:[
 'เฮอร์คิวลีสเป็นบุตรของซุส มีพละกำลังมหาศาลตั้งแต่ยังเป็นทารก',
 'เพื่อชดใช้ความผิดครั้งใหญ่ เขาต้องทำภารกิจที่แทบเป็นไปไม่ได้ถึงสิบสองอย่าง เช่น ปราบสิงโตแห่งนีเมีย ปราบงูไฮดรา และไปเอาแอปเปิลทองคำที่มีมังกรเฝ้า',
 'เมื่อเฮอร์คิวลีสสิ้นชีวิต ซุสนำเขาขึ้นไปอยู่บนท้องฟ้า สัตว์ร้ายที่เขาเคยปราบหลายตัวก็อยู่บนท้องฟ้าด้วย ทั้งสิงโต ไฮดรา ปู และมังกร',
 'บนท้องฟ้า เฮอร์คิวลีสอยู่ในท่าคุกเข่า มีดาวสี่ดวงเรียงเป็นสี่เหลี่ยมตรงลำตัว ใกล้ ๆ กันมีกระจุกดาวทรงกลมที่มีดาวหลายแสนดวงรวมกันอยู่']},
DRACO:{t:'มังกรเฝ้าแอปเปิลทองคำ',p:[
 'ในตำนานกรีก ลาดอนเป็นมังกรที่ไม่เคยหลับ คอยเฝ้าต้นแอปเปิลทองคำในสวนของเหล่านางไม้',
 'เฮอร์คิวลีสต้องไปนำแอปเปิลทองคำมาเป็นหนึ่งในสิบสองภารกิจ บางตำนานเล่าว่าเขาปราบมังกรตัวนี้',
 'เทพีเฮราจึงนำมังกรขึ้นไปไว้บนท้องฟ้า ลำตัวของมังกรขดเลื้อยอยู่ระหว่างหมีใหญ่กับหมีเล็ก',
 'เมื่อราวห้าพันปีก่อน ดาวทูแบนในกลุ่มดาวมังกรเคยเป็นดาวเหนือมาก่อน เพราะแกนโลกค่อย ๆ ส่ายไปตามกาลเวลา']},
OPH:{t:'หมอผู้ชุบชีวิตคนตาย',p:[
 'ในตำนานกรีก แอสคลีปิอุสเป็นบุตรของเทพอพอลโล ได้เรียนวิชาแพทย์จากไครอน คนครึ่งม้าผู้รอบรู้',
 'วันหนึ่งเขาเห็นงูตัวหนึ่งนำสมุนไพรมาชุบชีวิตงูอีกตัว แอสคลีปิอุสจึงเรียนรู้วิธีชุบชีวิตคนตาย',
 'เทพเฮดีสผู้ครองยมโลกไม่พอใจ เพราะไม่มีวิญญาณลงไปยมโลกอีก ซุสจึงใช้สายฟ้าฟาดแอสคลีปิอุส',
 'ภายหลังซุสยกย่องความดีของเขา จึงนำขึ้นไปเป็นกลุ่มดาวคนแบกงู โดยมีกลุ่มดาวงูอยู่ในมือ',
 'จนถึงทุกวันนี้ ไม้เท้าที่มีงูพันยังเป็นสัญลักษณ์ของการแพทย์']},
AURIGA:{t:'สารถีกับแม่แพะ',p:[
 'ในตำนานกรีก สารถีคือเอริกโธนิอัส กษัตริย์แห่งเอเธนส์ ผู้ประดิษฐ์รถม้าเทียมม้าสี่ตัว ซุสประทับใจจึงนำเขาขึ้นไปบนท้องฟ้า',
 'สารถีบนฟ้าอุ้มแม่แพะไว้ในอ้อมแขน ดาวคาเพลลาซึ่งแปลว่า “แพะตัวเมียน้อย” คือแม่แพะอามัลเธีย ที่เคยให้นมเลี้ยงซุสตอนเป็นทารก',
 'คาเพลลาเป็นดาวสีเหลืองคล้ายดวงอาทิตย์ สว่างเป็นอันดับหกของท้องฟ้ายามค่ำคืน']},
CENTAURUS:{t:'ไครอน คนครึ่งม้าผู้เป็นครู',p:[
 'คนครึ่งม้าส่วนใหญ่ในตำนานกรีกดุร้าย แต่ไครอนต่างออกไป เขาฉลาด ใจดี และรอบรู้ทั้งการแพทย์ ดนตรี และการยิงธนู',
 'ไครอนเป็นครูของวีรบุรุษหลายคน เช่น เฮอร์คิวลีส อคิลลีส และเจสัน',
 'วันหนึ่งไครอนถูกลูกศรอาบพิษไฮดราโดยไม่ตั้งใจ เขาเจ็บปวดแสนสาหัสแต่ไม่ตาย เพราะเป็นอมตะ',
 'ไครอนจึงยอมสละความเป็นอมตะ ซุสยกย่องในความดีของเขา และนำขึ้นไปเป็นกลุ่มดาวคนครึ่งม้า',
 'ที่เท้าของคนครึ่งม้าคือดาวแอลฟาเซนทอรี ระบบดาวที่อยู่ใกล้ระบบสุริยะที่สุด ห่างออกไปเพียงราว 4.4 ปีแสง']},
CRUX:{t:'กางเขนใต้ ดาวนำทางของซีกโลกใต้',p:[
 'กางเขนใต้เป็นกลุ่มดาวที่เล็กที่สุดใน 88 กลุ่ม แต่มีดาวสว่างสี่ดวงเรียงเป็นรูปไม้กางเขน',
 'นักเดินเรือในซีกโลกใต้ใช้กางเขนใต้หาทิศใต้ เพราะแกนยาวของกางเขนชี้ไปทางขั้วฟ้าใต้',
 'กลุ่มดาวนี้ปรากฏอยู่บนธงชาติของหลายประเทศ เช่น ออสเตรเลีย นิวซีแลนด์ และบราซิล',
 'ชาวอะบอริจินในออสเตรเลียมองบริเวณมืด ๆ ของทางช้างเผือกใกล้กางเขนใต้ ว่าเป็นหัวของนกอีมูยักษ์บนท้องฟ้า',
 'ในประเทศไทย ถ้ามองไปทางทิศใต้ในช่วงหัวค่ำเดือนมีนาคมถึงพฤษภาคม จะเห็นกางเขนใต้อยู่ต่ำ ๆ เหนือขอบฟ้า']},
AQR:{t:'แกนีมีด ผู้รินน้ำให้ทวยเทพ',p:[
 'ในตำนานกรีก แกนีมีดเป็นเด็กหนุ่มเลี้ยงแกะที่หน้าตางดงามที่สุด',
 'ซุสส่งนกอินทรีลงมารับเขาขึ้นไปบนเขาโอลิมปัส ให้เป็นผู้รินน้ำทิพย์ให้เหล่าเทพ',
 'บนท้องฟ้า แกนีมีดกำลังเทน้ำจากหม้อ สายน้ำไหลลงไปยังปากของกลุ่มดาวปลาใต้',
 'บริเวณนี้ของท้องฟ้ามีกลุ่มดาวที่เกี่ยวกับน้ำมากมาย ทั้งปลา วาฬ แพะทะเล และโลมา ชาวโบราณจึงเรียกย่านนี้ว่า “ทะเล”']},
CAP:{t:'แพน เทพครึ่งแพะครึ่งปลา',p:[
 'ในตำนานกรีก ครั้งหนึ่งยักษ์ไทฟอนผู้น่ากลัวบุกมาโจมตีเหล่าเทพ ทุกองค์ต่างแปลงกายเป็นสัตว์เพื่อหลบหนี',
 'เทพแพนผู้มีขาเป็นแพะกระโดดลงแม่น้ำอย่างรีบร้อน ร่างส่วนที่อยู่ใต้น้ำกลายเป็นหางปลา ส่วนที่อยู่เหนือน้ำยังเป็นแพะ',
 'ซุสเห็นว่าท่าทางนี้แปลกและน่ารัก จึงนำขึ้นไปไว้บนท้องฟ้าเป็นกลุ่มดาวแพะทะเล',
 'กลุ่มดาวนี้มีดาวไม่สว่างมาก เรียงกันเป็นรูปสามเหลี่ยมคล้ายเรือหรือรอยยิ้ม']},
PSC:{t:'ปลาสองตัวที่ผูกเชือกไว้ด้วยกัน',p:[
 'ในตำนานกรีก เทพีอะโฟรไดทีและบุตรชายชื่ออีรอสกำลังหนียักษ์ไทฟอน',
 'ทั้งคู่กระโดดลงแม่น้ำแล้วแปลงกายเป็นปลา และผูกเชือกเชื่อมกันไว้ เพื่อไม่ให้พลัดหลงจากกัน',
 'บนท้องฟ้าจึงเห็นปลาสองตัวว่ายอยู่คนละทาง โดยมีเส้นเชือกโยงถึงกัน',
 'กลุ่มดาวปลาเป็นกลุ่มดาวจักรราศีที่มีดาวจาง ต้องมองในที่มืดจึงเห็นได้ชัด']},
PSA:{t:'ปลาใต้ผู้ดื่มน้ำ',p:[
 'กลุ่มดาวปลาใต้เป็นปลาที่กำลังอ้าปากดื่มน้ำ ซึ่งไหลลงมาจากหม้อของกลุ่มดาวคนแบกหม้อน้ำ',
 'ที่ปากของปลาคือดาวโฟมัลฮอต ชื่อนี้แปลว่า “ปากปลา”',
 'โฟมัลฮอตเป็นดาวสว่างที่อยู่โดดเดี่ยวบนฟ้าทิศใต้ ช่วงหัวค่ำเดือนกันยายนถึงพฤศจิกายนจึงหาได้ง่าย']},
LIBRA:{t:'ตาชั่งแห่งความยุติธรรม',p:[
 'กลุ่มดาวคันชั่งถูกมองว่าเป็นตาชั่งของเทพีแห่งความยุติธรรม ซึ่งอยู่ข้างกลุ่มดาวหญิงสาว',
 'ในสมัยโบราณ ดาวกลุ่มนี้เคยถูกมองว่าเป็นก้ามของแมงป่อง ชื่อดาวบางดวงในภาษาอาหรับจึงยังแปลว่า “ก้ามด้านใต้” และ “ก้ามด้านเหนือ”',
 'คันชั่งเป็นกลุ่มดาวจักรราศีเพียงกลุ่มเดียวที่เป็นสิ่งของ ไม่ใช่คนหรือสัตว์']},
DELPHINUS:{t:'โลมาผู้เป็นแม่สื่อ',p:[
 'ในตำนานกรีก เทพโพไซดอนหลงรักนางไม้แห่งท้องทะเลชื่ออัมฟิไทรที แต่นางขี้อายและหนีไปซ่อนตัว',
 'โลมาตัวหนึ่งว่ายน้ำตามหาจนพบนาง และพูดโน้มน้าวให้นางกลับมาแต่งงานกับโพไซดอน',
 'โพไซดอนขอบคุณโลมามาก จึงนำมันขึ้นไปไว้บนท้องฟ้า',
 'กลุ่มดาวโลมาเล็กน่ารัก มีดาวสี่ดวงเรียงเป็นรูปสี่เหลี่ยมเล็ก ๆ เหมือนตัวโลมา และมีหางยื่นออกไป']},
LEPUS:{t:'กระต่ายใต้เท้านายพราน',p:[
 'กลุ่มดาวกระต่ายอยู่ใต้เท้าของนายพรานโอไรออนพอดี ชาวกรีกมองว่าเป็นกระต่ายที่นายพรานกำลังไล่ล่า',
 'ข้าง ๆ กันมีสุนัขใหญ่ของนายพรานคอยไล่ตามอยู่ กระต่ายตัวนี้จึงต้องวิ่งหนีอยู่บนท้องฟ้าทุกคืน']},
ERIDANUS:{t:'แม่น้ำบนท้องฟ้า',p:[
 'กลุ่มดาวแม่น้ำคือแม่น้ำอีริดานัส ที่ฟีทอนตกลงไปหลังจากขับรถม้าเทียมดวงอาทิตย์จนควบคุมไม่ได้',
 'แม่น้ำสายนี้คดเคี้ยวยาวมาก เริ่มจากใกล้เท้านายพรานไหลลงไปจนถึงฟ้าซีกใต้',
 'ปลายแม่น้ำคือดาวอเคอร์นาร์ ชื่อนี้แปลว่า “ปลายแม่น้ำ”']},
CROW:{t:'อีกากับถ้วยน้ำ',p:[
 'ในตำนานกรีก เทพอพอลโลส่งอีกาให้นำถ้วยไปตักน้ำ',
 'ระหว่างทางอีกาเห็นต้นมะเดื่อ จึงแวะรอให้ผลสุกแล้วกินจนอิ่ม กว่าจะนึกได้ก็สายมาก',
 'อีกาจึงจับงูน้ำมาตัวหนึ่ง แล้วโกหกอพอลโลว่างูตัวนี้ขวางทางน้ำไว้',
 'อพอลโลรู้ทันจึงลงโทษ นำอีกา ถ้วย และงูขึ้นไปไว้บนท้องฟ้า โดยให้งูไฮดราคั่นไว้ อีกาจึงไม่มีวันได้ดื่มน้ำจากถ้วยนั้นอีกเลย']},
SAGITTA:{t:'ลูกศรของเฮอร์คิวลีส',p:[
 'ในตำนานกรีก โพรมีธีอุสขโมยไฟจากสวรรค์มาให้มนุษย์ ซุสจึงลงโทษโดยล่ามเขาไว้กับภูเขา และส่งนกอินทรีมาจิกกินตับทุกวัน',
 'เฮอร์คิวลีสผ่านมาเห็น จึงยิงลูกศรสังหารนกอินทรี และปลดปล่อยโพรมีธีอุส',
 'ลูกศรดอกนั้นถูกนำขึ้นไปไว้บนท้องฟ้า เป็นกลุ่มดาวเล็ก ๆ ที่อยู่ใกล้กลุ่มดาวนกอินทรี']},
CRB:{t:'มงกุฎของเจ้าหญิงอาริแอดนี',p:[
 'ในตำนานกรีก เจ้าหญิงอาริแอดนีช่วยธีซีอุสหาทางออกจากเขาวงกตของมิโนทอร์ ด้วยการให้ม้วนด้ายไว้คลายตามทาง',
 'แต่ภายหลังธีซีอุสกลับทิ้งนางไว้บนเกาะนักซอส',
 'เทพไดโอนีซัสพบอาริแอดนีและแต่งงานกับนาง โดยมอบมงกุฎประดับอัญมณีให้เป็นของขวัญ',
 'ต่อมามงกุฎถูกโยนขึ้นไปบนท้องฟ้า อัญมณีกลายเป็นดาวที่เรียงเป็นรูปครึ่งวงกลมสวยงาม']},
COMA:{t:'ผมของพระราชินีเบเรนิซ',p:[
 'กลุ่มดาวนี้มาจากเรื่องจริงในอียิปต์โบราณ พระราชินีเบเรนิซสัญญากับเทพว่า หากพระสวามีกลับจากสงครามอย่างปลอดภัย พระนางจะตัดผมยาวสลวยถวาย',
 'เมื่อพระราชากลับมา พระนางก็ตัดผมถวายไว้ในวิหาร แต่วันรุ่งขึ้นผมนั้นกลับหายไป',
 'นักดาราศาสตร์ประจำราชสำนักจึงทูลว่า เทพพอใจมาก จึงนำผมของพระนางขึ้นไปไว้บนท้องฟ้าแล้ว',
 'กลุ่มดาวนี้เป็นกระจุกดาวจาง ๆ คล้ายเส้นผมที่ระยิบระยับ']},
ARA:{t:'แท่นบูชาของเหล่าเทพ',p:[
 'ในตำนานกรีก ก่อนสงครามครั้งใหญ่ระหว่างเหล่าเทพโอลิมปัสกับพวกไททัน เทพทั้งหลายมาร่วมสาบานความจงรักภักดีกันที่แท่นบูชานี้',
 'เมื่อชนะสงคราม ซุสจึงนำแท่นบูชาขึ้นไปไว้บนท้องฟ้า','กลุ่มดาวนี้อยู่ทางทิศใต้ ใต้หางของแมงป่อง']},
COLUMBA:{t:'นกพิราบของโนอาห์',p:[
 'กลุ่มดาวนกพิราบตั้งชื่อขึ้นเมื่อราวปี ค.ศ. 1600 โดยนักทำแผนที่ชาวดัตช์',
 'นกพิราบตัวนี้มาจากเรื่องเรือของโนอาห์ ที่ปล่อยนกพิราบออกไปหาแผ่นดินหลังน้ำท่วมโลก นกบินกลับมาพร้อมกิ่งมะกอก เป็นสัญญาณว่าน้ำเริ่มลดแล้ว',
 'กลุ่มดาวนี้อยู่ใกล้กลุ่มดาวกระต่าย ใต้เท้านายพราน']},
LUPUS:{t:'หมาป่า',p:['กลุ่มดาวหมาป่าเป็นหนึ่งในกลุ่มดาวโบราณ อยู่ติดกับกลุ่มดาวคนครึ่งม้า','ชาวกรีกโบราณมองว่าเป็นสัตว์ป่าที่คนครึ่งม้ากำลังถืออยู่','กลุ่มดาวนี้อยู่บนแนวทางช้างเผือก ใกล้กับกลุ่มดาวแมงป่อง']},
DUTCH:{t:'กลุ่มดาวของนักเดินเรือ',p:[
 'กลุ่มดาวนี้ตั้งชื่อขึ้นใหม่เมื่อราวปี ค.ศ. 1600 จากการสังเกตของนักเดินเรือชาวดัตช์ที่ล่องเรือไปยังหมู่เกาะอินเดียตะวันออก ซึ่งก็คืออินโดนีเซียในปัจจุบัน',
 'ชาวยุโรปไม่เคยเห็นท้องฟ้าซีกใต้มาก่อน จึงตั้งชื่อตามสัตว์แปลกตาที่พบระหว่างการเดินทาง เช่น นกยูง นกทูแคน นกกระเรียน และปลาบิน',
 'กลุ่มดาวนี้จึงยังไม่มีตำนานโบราณ แต่มีเรื่องราวของการผจญภัยในทะเล']},
LACAILLE:{t:'กลุ่มดาวเครื่องมือวิทยาศาสตร์',p:[
 'นิโกลา-หลุยส์ เดอ ลากาย นักดาราศาสตร์ชาวฝรั่งเศส ตั้งชื่อกลุ่มดาวนี้เมื่อราวปี ค.ศ. 1750 ระหว่างไปสังเกตดาวที่แหลมกู๊ดโฮปในแอฟริกาใต้',
 'เขาทำแผนที่ดาวในฟ้าซีกใต้ได้นับหมื่นดวง และนิยมตั้งชื่อกลุ่มดาวใหม่ตามเครื่องมือวิทยาศาสตร์และศิลปะ เช่น กล้องโทรทรรศน์ กล้องจุลทรรศน์ นาฬิกา และเครื่องสูบลม',
 'กลุ่มดาวเหล่านี้จึงเป็นเหมือนอนุสรณ์ของยุคแห่งการค้นพบทางวิทยาศาสตร์']},
HEVELIUS:{t:'กลุ่มดาวเติมช่องว่าง',p:[
 'โยฮันเนส เฮเวลิอุส นักดาราศาสตร์ชาวโปแลนด์ ตั้งชื่อกลุ่มดาวนี้ในหนังสือแผนที่ดาวที่ตีพิมพ์ในปี ค.ศ. 1690',
 'เขาต้องการเติมช่องว่างระหว่างกลุ่มดาวโบราณ ดาวส่วนใหญ่ในกลุ่มเหล่านี้จึงค่อนข้างจาง',
 'มีเกร็ดว่า เฮเวลิอุสตั้งชื่อกลุ่มดาวแมวป่า เพราะต้องมีสายตาแหลมคมเหมือนแมวป่าถึงจะมองเห็นได้']},
ANCIENT:{t:'กลุ่มดาวโบราณ',p:[
 'กลุ่มดาวนี้เป็นหนึ่งใน 48 กลุ่มดาวโบราณ ที่นักดาราศาสตร์ชื่อปโตเลมีบันทึกไว้เมื่อเกือบสองพันปีก่อน',
 'ผู้คนในสมัยนั้นใช้ดาวบอกเวลา ฤดูกาล และทิศทาง ก่อนจะมีนาฬิกาและเข็มทิศ']},
GENERIC:{t:'หนึ่งใน 88 กลุ่มดาวสากล',p:[
 'ท้องฟ้าทั้งหมดถูกแบ่งออกเป็น 88 กลุ่มดาว โดยสหพันธ์ดาราศาสตร์สากล เหมือนการแบ่งแผนที่โลกเป็นประเทศ',
 'ทุกจุดบนท้องฟ้าจึงอยู่ในกลุ่มดาวใดกลุ่มดาวหนึ่งเสมอ']}
};

const BODY_MYTH={
 Sun:{t:'ดวงอาทิตย์ ดาวฤกษ์ของเรา',p:['ดวงอาทิตย์เป็นดาวฤกษ์ที่อยู่ใกล้โลกที่สุด แสงจากดวงอาทิตย์ใช้เวลาประมาณแปดนาทีกว่าจะเดินทางมาถึงโลก','ในตำนานกรีก เทพเฮลิออสขับรถม้าเทียมดวงอาทิตย์ข้ามท้องฟ้าจากตะวันออกไปตะวันตกทุกวัน','ในความเชื่อของไทย วันอาทิตย์เป็นวันของพระอาทิตย์ สีประจำวันคือสีแดง','ข้อควรระวัง ห้ามมองดวงอาทิตย์ด้วยตาเปล่า กล้องส่องทางไกล หรือกล้องโทรทรรศน์ เพราะอาจทำให้ตาบอดได้']},
 Moon:{t:'กระต่ายบนดวงจันทร์',p:['คนไทยมองเห็นรูปกระต่ายบนดวงจันทร์ ตามนิทานชาดก','เล่าว่ากระต่ายตัวหนึ่งไม่มีอาหารจะถวายแก่นักบวชผู้หิวโหย จึงยอมกระโดดเข้ากองไฟเพื่อให้ร่างของตนเป็นอาหาร','นักบวชผู้นั้นแท้จริงคือพระอินทร์ที่แปลงกายมาทดสอบ พระองค์จึงวาดรูปกระต่ายไว้บนดวงจันทร์ ให้ทุกคนระลึกถึงความเสียสละ','ดวงจันทร์โคจรรอบโลกประมาณเดือนละรอบ เราจึงเห็นข้างขึ้นข้างแรมเปลี่ยนไปทุกคืน','ในความเชื่อของไทย วันจันทร์มีสีประจำวันคือสีเหลือง']},
 Mercury:{t:'ดาวพุธ ผู้ส่งสารแห่งทวยเทพ',p:['ดาวพุธตั้งชื่อตามเทพเมอร์คิวรีของโรมัน ผู้ส่งสารที่เดินทางรวดเร็วที่สุด เพราะดาวพุธโคจรรอบดวงอาทิตย์เร็วที่สุด ใช้เวลาเพียงประมาณ 88 วัน','ดาวพุธอยู่ใกล้ดวงอาทิตย์มาก จึงเห็นได้เฉพาะช่วงหัวค่ำหรือก่อนรุ่งเช้า ต่ำ ๆ ใกล้ขอบฟ้า','ในความเชื่อของไทย วันพุธมีสีประจำวันคือสีเขียว']},
 Venus:{t:'ดาวศุกร์ ดาวประกายพรึก',p:['ดาวศุกร์ตั้งชื่อตามวีนัส เทพีแห่งความรักและความงามของโรมัน เพราะเป็นดาวที่สว่างงดงามที่สุดรองจากดวงจันทร์','คนไทยเรียกดาวศุกร์ที่เห็นตอนเช้ามืดว่า “ดาวประกายพรึก” และเรียกดาวศุกร์ที่เห็นตอนหัวค่ำว่า “ดาวประจำเมือง”','ดาวศุกร์ร้อนที่สุดในระบบสุริยะ เพราะมีบรรยากาศหนาทึบที่กักเก็บความร้อนไว้','ในความเชื่อของไทย วันศุกร์มีสีประจำวันคือสีฟ้า']},
 Mars:{t:'ดาวอังคาร ดาวเคราะห์สีแดง',p:['ดาวอังคารตั้งชื่อตามมาร์ส เทพแห่งสงครามของโรมัน เพราะมีสีแดงคล้ายเลือดและไฟ','สีแดงของดาวอังคารมาจากฝุ่นเหล็กออกไซด์ หรือสนิมเหล็กที่ปกคลุมพื้นผิว','บนดาวอังคารมีภูเขาไฟโอลิมปัส ซึ่งสูงกว่ายอดเขาเอเวอเรสต์ประมาณสองเท่าครึ่ง','ในความเชื่อของไทย วันอังคารมีสีประจำวันคือสีชมพู']},
 Jupiter:{t:'ดาวพฤหัสบดี ราชาแห่งดาวเคราะห์',p:['ดาวพฤหัสบดีตั้งชื่อตามจูปิเตอร์ ราชาแห่งทวยเทพของโรมัน เพราะเป็นดาวเคราะห์ที่ใหญ่ที่สุดในระบบสุริยะ ใหญ่จนบรรจุโลกได้มากกว่าหนึ่งพันดวง','ถ้าใช้กล้องสองตาส่อง จะเห็นจุดเล็ก ๆ สี่ดวงเรียงอยู่ข้าง ๆ คือดวงจันทร์บริวารที่กาลิเลโอค้นพบเมื่อปี ค.ศ. 1610','ในความเชื่อของไทย วันพฤหัสบดีมีสีประจำวันคือสีส้ม']},
 Saturn:{t:'ดาวเสาร์ เจ้าแห่งวงแหวน',p:['ดาวเสาร์ตั้งชื่อตามแซตเทิร์น เทพแห่งการเกษตรของโรมัน','ดาวเสาร์มีวงแหวนสวยงามที่ประกอบด้วยก้อนน้ำแข็งและหินนับไม่ถ้วน มองเห็นได้ด้วยกล้องโทรทรรศน์ขนาดเล็ก','ดาวเสาร์มีความหนาแน่นน้อยมาก ถ้ามีอ่างน้ำที่ใหญ่พอ ดาวเสาร์จะลอยน้ำได้','ในความเชื่อของไทย วันเสาร์มีสีประจำวันคือสีม่วง']},
 Uranus:{t:'ดาวยูเรนัส ดาวเคราะห์ที่นอนตะแคง',p:['ดาวยูเรนัสตั้งชื่อตามยูเรนัส เทพแห่งท้องฟ้าของกรีก','วิลเลียม เฮอร์เชล ค้นพบดาวยูเรนัสด้วยกล้องโทรทรรศน์ในปี ค.ศ. 1781 เป็นดาวเคราะห์ดวงแรกที่ค้นพบในยุคใหม่','แกนของดาวยูเรนัสเอียงมากจนดูเหมือนกลิ้งตะแคงไปรอบดวงอาทิตย์']},
 Neptune:{t:'ดาวเนปจูน ดาวที่พบด้วยคณิตศาสตร์',p:['ดาวเนปจูนตั้งชื่อตามเนปจูน เทพแห่งท้องทะเลของโรมัน เพราะมีสีฟ้าเข้มเหมือนทะเลลึก','นักดาราศาสตร์สังเกตว่าวงโคจรของดาวยูเรนัสผิดปกติ จึงใช้คณิตศาสตร์คำนวณว่าน่าจะมีดาวเคราะห์อีกดวงหนึ่งดึงอยู่ และพบดาวเนปจูนในปี ค.ศ. 1846 ตรงตามที่คำนวณไว้','ดาวเนปจูนอยู่ไกลมาก ไม่สามารถมองเห็นได้ด้วยตาเปล่า ต้องใช้กล้องโทรทรรศน์']}
};
// ===================== Star legends — English =====================
const MYTHS_EN={
ORION:{t:'Orion, the hunter who never meets the Scorpion',p:[
 'Long ago, in Greek mythology, there lived a giant hunter named Orion. He was a son of Poseidon, god of the sea.',
 'Orion was such a skilled hunter that no animal could escape him. One day he boasted that he would hunt every creature on Earth.',
 'Gaia, Mother Earth, heard this and grew angry. She sent a giant scorpion, which stung Orion and killed him.',
 'The gods placed both the hunter and the scorpion in the sky, but on opposite sides.',
 'When the Scorpion rises in the east, Orion sets in the west, so the two are almost never seen in the sky together.',
 'In Thailand, people see the three belt stars and the stars below them as “Dao Thai”, the Plough, like a farmer’s plough.',
 'Look for orange-red Betelgeuse at the shoulder and blue-white Rigel at the foot. Their different colours tell us the two stars have different temperatures.']},
SCORPIUS:{t:'The Scorpion that chases the Hunter',p:[
 'In Greek mythology, this is the giant scorpion that Gaia, Mother Earth, sent to stop the hunter Orion, who boasted he would hunt every animal on Earth.',
 'The scorpion stung Orion and killed him. The gods raised both into the sky, but placed them on opposite sides.',
 'Even today, when the Scorpion rises in the east, Orion sinks below the western horizon, as if he is still running away.',
 'The Scorpion’s heart is Antares, a red supergiant. Its name means “rival of Mars”, because both are red.',
 'From Thailand, Scorpius is easy to see in the south in the early evening from May to August. Look for its tail curling like a hook.']},
UMA:{t:'Callisto, the mother bear in the sky',p:[
 'In Greek mythology, Callisto was a beautiful nymph who had a son with Zeus, named Arcas.',
 'Hera, the wife of Zeus, was jealous and turned Callisto into a bear. She had to wander the forest alone.',
 'Years later Arcas grew up to be a hunter. One day he met a bear in the forest and was about to shoot it, not knowing the bear was his own mother.',
 'Zeus saw this and turned Arcas into a little bear, then swung both bears up into the sky by their tails. That is why the sky bears have such long tails.',
 'In Thailand, the seven stars that form the Big Dipper are called “Dao Chorakhe”, the Crocodile.',
 'Tip: follow the two stars at the end of the Dipper’s bowl about five times their distance apart, and you will find the North Star.']},
UMI:{t:'The bear cub and the North Star',p:[
 'In Greek myth, the Little Bear is Arcas, son of Callisto. Zeus turned him into a bear and placed him near his mother in the sky.',
 'The tip of the Little Bear’s tail is the North Star, Polaris, which sits almost exactly at the north celestial pole.',
 'While other stars wheel around the sky all night, the North Star hardly moves at all. Travellers and sailors have used it to find north for hundreds of years.',
 'The height of the North Star above the horizon equals your latitude. In Bangkok it is low, about 14 degrees, so look north from a place with no buildings in the way.']},
LYRA:{t:'The lyre of Orpheus, and the Weaver Princess',p:[
 'In Greek mythology, Orpheus was the greatest musician in the world. When he played his lyre, even trees and rocks swayed to the music.',
 'One day Eurydice, the wife he loved, was bitten by a snake and died. Orpheus travelled down to the Underworld.',
 'His music softened the heart of Hades, lord of the Underworld, who let him take his wife home on one condition: he must not look back until they reached the world of the living.',
 'Near the exit, Orpheus could not help himself and turned around. Eurydice vanished back into the Underworld forever.',
 'After Orpheus died, the gods placed his lyre in the sky.',
 'In a Chinese legend, the star Vega is the Weaver Girl of heaven, who fell in love with a cowherd, the star Altair.',
 'The Milky Way keeps them apart, and they can meet only once a year, on the seventh night of the seventh lunar month, when magpies fly together to form a bridge across the Milky Way.']},
AQUILA:{t:'The eagle of Zeus, and the Cowherd',p:[
 'In Greek mythology, this eagle was the companion of Zeus and carried his mighty thunderbolts.',
 'Once Zeus sent the eagle down to Earth to fetch a young shepherd named Ganymede, who became cup-bearer to the gods on Mount Olympus.',
 'The brightest star in the group is Altair. In Chinese legend, Altair is the Cowherd, beloved of the Weaver Girl, the star Vega.',
 'The two are on opposite banks of the Milky Way and meet only once a year, on the seventh night of the seventh lunar month.',
 'Altair, Vega and Deneb together form the “Summer Triangle”, easy to see in the early evening from July to October.']},
CYGNUS:{t:'The faithful swan',p:[
 'In Greek mythology, Phaethon, son of the Sun god, borrowed the chariot of the Sun but could not control the horses. Zeus had to strike him with a thunderbolt, and Phaethon fell into the river Eridanus.',
 'Cygnus, Phaethon’s best friend, dived into the river again and again to search for him, never giving up.',
 'The gods were moved by his loyalty, turned Cygnus into a swan and placed him in the sky.',
 'The Swan flies right along the Milky Way. It is sometimes called the “Northern Cross”, because its stars form the shape of a cross.',
 'The swan’s tail is Deneb, a giant star that is very far away, yet still bright enough to see with the naked eye.']},
TAURUS:{t:'The white bull of Zeus, and the Pleiades',p:[
 'In Greek mythology, Zeus turned himself into a gentle white bull to get close to Princess Europa, who was playing by the sea.',
 'When the princess climbed onto his back, the white bull swam across the sea to the island of Crete. The continent of Europe is named after her.',
 'The bull’s eye is orange Aldebaran. On the bull’s back is a small cluster of stars that Thai people call “Dao Luk Kai”, the Chicks.',
 'A Thai legend tells of an old couple who kept a mother hen and her chicks. One day a wandering monk came to stay in the village, and the couple had nothing to cook for him, so they decided to kill the hen.',
 'The hen knew, and sadly said goodbye to her chicks. When she was killed, all six chicks jumped into the fire after their mother out of love.',
 'The gods saw their devotion and raised the hen and her chicks into the sky as the Pleiades, so they could stay together forever.']},
CMA:{t:'The hunter’s dog, and the brightest star',p:[
 'In Greek mythology, the Great Dog is Orion’s faithful hunting dog, running after its master across the sky every night.',
 'Another tale tells of a dog named Laelaps that no prey could escape. It was sent to catch a fox that nobody could catch.',
 'The chase could never end, so Zeus turned both animals to stone and placed the dog in the sky.',
 'At the dog’s mouth is Sirius, the brightest star in the night sky, about 8.6 light-years from Earth.',
 'The ancient Egyptians noticed that when Sirius rose just before the Sun at dawn, the Nile flood season was near.',
 'Tip: follow the line of Orion’s belt down to the left and you will find Sirius.']},
CMI:{t:'The hunter’s little dog',p:[
 'The Little Dog is another of Orion’s dogs, running close behind the Great Dog.',
 'Its bright star is Procyon, which means “before the dog”, because it rises a little before Sirius.',
 'Procyon, Sirius and Betelgeuse form the “Winter Triangle”, easy to see in the early evening from December to March.']},
GEMINI:{t:'The twins who would not be parted',p:[
 'In Greek mythology, Castor and Pollux were twin brothers who loved each other dearly. Castor was an ordinary mortal, but Pollux was a son of Zeus and immortal.',
 'They always went on adventures together, including the voyage of the Argo in search of the Golden Fleece.',
 'When Castor was killed in battle, Pollux was heartbroken and asked Zeus to share his immortality with his brother.',
 'Zeus was moved by their love and placed them side by side in the sky forever.',
 'Ancient sailors honoured the twins as protectors of ships at sea.',
 'Look for two bright stars close together. Those are the heads of the twins.']},
LEO:{t:'The Nemean Lion',p:[
 'In Greek mythology, the Nemean Lion was a monster whose hide was so tough that no sword, spear or arrow could harm it.',
 'Heracles, the strongest of heroes, was given the first of his twelve labours: defeat this lion.',
 'When his weapons failed, Heracles wrestled the lion with his bare hands and won, then wore its hide as armour.',
 'Hera placed the lion in the sky.',
 'The lion’s head is shaped like a sickle, or a backwards question mark. The bright star at its base is Regulus, meaning “little king”.']},
VIRGO:{t:'The goddess of the harvest and the seasons',p:[
 'The Greeks linked the Maiden with Demeter, goddess of farming, and her daughter Persephone.',
 'One day Hades, lord of the Underworld, carried Persephone away to be his queen. Demeter grieved so much that plants all over the world withered.',
 'Zeus ordered Hades to return Persephone, but because she had eaten pomegranate seeds in the Underworld, she had to go back there for part of every year.',
 'While her daughter is away, Demeter is sad and the world turns cold: winter. When her daughter returns, flowers bloom: spring.',
 'The bright star of the Maiden is Spica, meaning “ear of grain”, which she holds in her hand.']},
BOOTES:{t:'The bear driver',p:[
 'The Herdsman is shaped like a kite or an ice-cream cone. The Greeks saw him as a man driving the Great Bear around the north pole of the sky without rest.',
 'Its bright star is Arcturus, meaning “guardian of the bear”. It is an orange giant, the fourth brightest star in the night sky.',
 'Tip: follow the curve of the Big Dipper’s handle, “arc to Arcturus”, then keep curving on to “speed on to Spica” in Virgo.']},
SGR:{t:'The centaur archer',p:[
 'The Greeks saw this constellation as a centaur drawing his bow. His arrow points at Antares, the heart of the Scorpion, as if guarding the sky from it.',
 'Today many people see its bright stars as a “Teapot”, with a spout, a handle and a lid.',
 'The steam rising from the spout is the glow of the Milky Way, because this direction points to the centre of our galaxy.',
 'At that centre lies a supermassive black hole about four million times the mass of the Sun.']},
PERSEUS:{t:'Perseus and Princess Andromeda',p:[
 'In Greek mythology, Queen Cassiopeia boasted that she and her daughter, Princess Andromeda, were more beautiful than the sea nymphs.',
 'Poseidon was furious and sent the sea monster Cetus to wreck the kingdom.',
 'King Cepheus was told that he must sacrifice Andromeda to the monster, so the princess was chained to a rock by the sea.',
 'At that moment the hero Perseus had just defeated Medusa, the snake-haired monster whose gaze turned people to stone. Flying past, he saw the princess in danger.',
 'When Cetus rose from the sea, Perseus held up Medusa’s head, and the monster turned to stone at once. He saved Andromeda, and the two were married.',
 'The winged horse Pegasus was born when Medusa was defeated, so every character of this story is close together in the sky: king, queen, princess, hero, winged horse and sea monster.',
 'Queen Cassiopeia was punished by being made to sit on a throne that circles the pole, so at times she hangs upside down.',
 'The star Algol in Perseus was seen as the eye of Medusa. It dims every 2.9 days or so.']},
ARGO:{t:'The Argo and the Golden Fleece',p:[
 'In Greek mythology, Jason was given a quest to bring back the Golden Fleece, so he could reclaim the throne that had been stolen.',
 'He built a great ship called the Argo and gathered about fifty heroes, the Argonauts, among them Heracles, Orpheus, and the twins Castor and Pollux.',
 'They faced many dangers, including giant clashing rocks and a dragon that never slept guarding the fleece, before completing their quest.',
 'The Argo was placed in the sky. It was once a huge constellation, which astronomers later split into three: the Keel, the Stern and the Sails.',
 'Canopus, in the Keel, is the second brightest star in the sky. From Thailand it appears low in the south.']},
ARIES:{t:'The ram with the golden fleece',p:[
 'In Greek mythology, Prince Phrixus and Princess Helle were the targets of a plot by their cruel stepmother.',
 'A magical ram with golden wool flew down and carried the two across the sea. On the way, Helle fell into the water, but Phrixus reached the land of Colchis safely.',
 'The Golden Fleece was hung in a sacred grove, guarded by a dragon, until Jason and the Argonauts came to take it.',
 'The ram itself was placed in the sky as the constellation Aries, one of the constellations of the zodiac.']},
HYDRA:{t:'The many-headed Hydra',p:[
 'The Hydra was a giant water serpent with many heads. Worst of all, whenever one head was cut off, two new ones grew in its place.',
 'Heracles was sent to defeat it. His nephew Iolaus burned each stump with a torch so no new head could grow, and together they won.',
 'Hydra is the largest of the 88 constellations, stretching across almost a quarter of the sky.',
 'Its bright star is Alphard, meaning “the solitary one”, because no other bright star is near it.']},
CANCER:{t:'The brave crab',p:[
 'While Heracles was fighting the Hydra, the goddess Hera, who disliked him, sent a giant crab to pinch his foot.',
 'Heracles crushed the crab, but Hera honoured its courage and placed it in the sky.',
 'The stars of Cancer are faint, but at its centre is the Beehive Cluster, which looks like a faint smudge to the naked eye in a truly dark place.']},
HERCULES:{t:'Heracles and his twelve labours',p:[
 'Heracles, called Hercules by the Romans, was a son of Zeus with enormous strength even as a baby.',
 'To make up for a terrible wrong, he had to complete twelve almost impossible labours, such as defeating the Nemean Lion, slaying the Hydra, and fetching the golden apples guarded by a dragon.',
 'When Heracles died, Zeus raised him into the sky. Many of the beasts he defeated are there too: the lion, the Hydra, the crab and the dragon.',
 'In the sky, Hercules is kneeling, with four stars forming a square at his body. Nearby is a globular cluster of hundreds of thousands of stars.']},
DRACO:{t:'The dragon of the golden apples',p:[
 'In Greek mythology, Ladon was a dragon that never slept, guarding the tree of golden apples in the garden of the nymphs.',
 'Heracles had to fetch the golden apples as one of his twelve labours. Some versions say he defeated this dragon.',
 'Hera placed the dragon in the sky, its body coiling between the Great Bear and the Little Bear.',
 'About five thousand years ago, the star Thuban in Draco was the North Star, because Earth’s axis slowly wobbles over time.']},
OPH:{t:'The healer who could raise the dead',p:[
 'In Greek mythology, Asclepius was a son of Apollo who learned medicine from Chiron, the wise centaur.',
 'One day he saw a snake bring herbs to revive another snake, and so Asclepius learned how to bring the dead back to life.',
 'Hades, lord of the Underworld, was unhappy, because no more souls were coming down to him, so Zeus struck Asclepius with a thunderbolt.',
 'Later Zeus honoured his good deeds and placed him in the sky as the Serpent Bearer, holding the constellation of the Serpent.',
 'To this day, a staff with a snake wrapped around it is a symbol of medicine.']},
AURIGA:{t:'The charioteer and the mother goat',p:[
 'In Greek mythology, the Charioteer is Erichthonius, a king of Athens who invented the four-horse chariot. Zeus was impressed and raised him into the sky.',
 'The Charioteer holds a goat in his arms. The star Capella, meaning “little she-goat”, is the goat Amalthea, who nursed Zeus when he was a baby.',
 'Capella is a yellow star like our Sun, and the sixth brightest star in the night sky.']},
CENTAURUS:{t:'Chiron, the centaur teacher',p:[
 'Most centaurs in Greek myth were wild, but Chiron was different. He was wise, kind, and skilled in medicine, music and archery.',
 'Chiron was the teacher of many heroes, such as Heracles, Achilles and Jason.',
 'One day Chiron was accidentally struck by an arrow poisoned with the Hydra’s blood. He was in terrible pain but could not die, because he was immortal.',
 'Chiron chose to give up his immortality. Zeus honoured his goodness and placed him in the sky as the Centaur.',
 'At the centaur’s foot is Alpha Centauri, the star system closest to our Solar System, only about 4.4 light-years away.']},
CRUX:{t:'The Southern Cross, guide of the southern seas',p:[
 'The Southern Cross is the smallest of the 88 constellations, but it has four bright stars arranged in a cross.',
 'Sailors in the Southern Hemisphere use it to find south, because the long bar of the cross points toward the south celestial pole.',
 'It appears on the flags of several countries, such as Australia, New Zealand and Brazil.',
 'Aboriginal Australians see the dark patch of the Milky Way near the Southern Cross as the head of a giant emu in the sky.',
 'From Thailand, look south in the early evening from March to May to see the Southern Cross low above the horizon.']},
AQR:{t:'Ganymede, cup-bearer of the gods',p:[
 'In Greek mythology, Ganymede was the most handsome young shepherd.',
 'Zeus sent an eagle to carry him up to Mount Olympus, to pour nectar for the gods.',
 'In the sky, Ganymede pours water from a jar, and the stream flows down into the mouth of the Southern Fish.',
 'This part of the sky has many water constellations: the fishes, the whale, the sea-goat and the dolphin. The ancients called it “the Sea”.']},
CAP:{t:'Pan, half goat and half fish',p:[
 'In Greek mythology, the terrifying giant Typhon once attacked the gods, and they all changed into animals to escape.',
 'Pan, the god with goat legs, leapt into a river in a hurry. The part of him under water became a fish tail, while the part above stayed a goat.',
 'Zeus found this shape funny and charming, and placed it in the sky as Capricornus, the Sea-Goat.',
 'Its stars are not very bright, forming a triangle that looks like a boat, or a smile.']},
PSC:{t:'Two fish tied together',p:[
 'In Greek mythology, the goddess Aphrodite and her son Eros were fleeing the giant Typhon.',
 'They jumped into a river, turned into fish, and tied themselves together with a cord so they would not be separated.',
 'In the sky we see two fish swimming in different directions, joined by a cord.',
 'Pisces is a zodiac constellation with faint stars, best seen from a dark place.']},
PSA:{t:'The Southern Fish',p:[
 'The Southern Fish is drinking water that pours from the jar of Aquarius, the Water Bearer.',
 'At the fish’s mouth is the star Fomalhaut, which means “mouth of the fish”.',
 'Fomalhaut is a lonely bright star in the southern sky, easy to find in the early evening from September to November.']},
LIBRA:{t:'The scales of justice',p:[
 'Libra is seen as the scales of the goddess of justice, next to Virgo, the Maiden.',
 'In ancient times these stars were seen as the claws of the Scorpion, so some of their Arabic names still mean “southern claw” and “northern claw”.',
 'Libra is the only zodiac constellation that is an object rather than a person or an animal.']},
DELPHINUS:{t:'The dolphin matchmaker',p:[
 'In Greek mythology, Poseidon fell in love with the sea nymph Amphitrite, but she was shy and went into hiding.',
 'A dolphin swam far and wide until it found her, and persuaded her to come back and marry Poseidon.',
 'Poseidon was so grateful that he placed the dolphin in the sky.',
 'Delphinus is small and charming: four stars form a little diamond like a dolphin’s body, with a tail sticking out.']},
LEPUS:{t:'The hare at the hunter’s feet',p:[
 'Lepus, the Hare, lies right under the feet of Orion. The Greeks saw it as a hare being chased by the hunter.',
 'Orion’s Great Dog is close by, chasing it too, so this hare must keep running across the sky every night.']},
ERIDANUS:{t:'The river in the sky',p:[
 'Eridanus is the river into which Phaethon fell after losing control of the chariot of the Sun.',
 'This river winds a very long way, starting near Orion’s foot and flowing far down into the southern sky.',
 'At its end is the star Achernar, which means “end of the river”.']},
CROW:{t:'The crow and the cup of water',p:[
 'In Greek mythology, Apollo sent a crow to fetch water in a cup.',
 'On the way the crow saw a fig tree, waited for the figs to ripen and ate until it was full. By the time it remembered, it was very late.',
 'So the crow caught a water snake and lied to Apollo that the snake had blocked the spring.',
 'Apollo saw through the lie and punished it, placing the crow, the cup and the snake in the sky, with Hydra between them, so the crow could never drink from the cup again.']},
SAGITTA:{t:'The arrow of Heracles',p:[
 'In Greek mythology, Prometheus stole fire from heaven for humans. Zeus punished him by chaining him to a mountain and sending an eagle to peck at his liver every day.',
 'Heracles passed by, shot the eagle with an arrow, and set Prometheus free.',
 'That arrow was placed in the sky as a small constellation near Aquila, the Eagle.']},
CRB:{t:'Princess Ariadne’s crown',p:[
 'In Greek mythology, Princess Ariadne helped Theseus escape the Minotaur’s labyrinth by giving him a ball of thread to unwind along the way.',
 'But afterwards Theseus left her behind on the island of Naxos.',
 'The god Dionysus found Ariadne and married her, giving her a jewelled crown as a wedding gift.',
 'Later the crown was thrown into the sky, and its jewels became stars forming a beautiful half-circle.']},
COMA:{t:'Queen Berenice’s hair',p:[
 'This constellation comes from a true story in ancient Egypt. Queen Berenice promised the gods that if her husband returned safely from war, she would cut off her long, beautiful hair as an offering.',
 'When the king returned, she cut her hair and left it in the temple, but the next day it had disappeared.',
 'The court astronomer told her the gods were so pleased that they had placed her hair in the sky.',
 'The constellation is a faint cluster of stars that twinkles like strands of hair.']},
ARA:{t:'The altar of the gods',p:[
 'In Greek mythology, before the great war between the Olympian gods and the Titans, the gods gathered at this altar to swear loyalty to one another.',
 'After winning the war, Zeus placed the altar in the sky.','It lies in the south, below the tail of the Scorpion.']},
COLUMBA:{t:'Noah’s dove',p:[
 'The Dove was named around the year 1600 by Dutch mapmakers.',
 'It comes from the story of Noah’s Ark: Noah sent out a dove to look for land after the great flood, and it returned with an olive branch, a sign that the waters were going down.',
 'The Dove lies near Lepus, the Hare, below Orion’s feet.']},
LUPUS:{t:'The wolf',p:['Lupus, the Wolf, is one of the ancient constellations, lying next to the Centaur.','The ancient Greeks saw it as a wild animal held by the centaur.','It lies along the Milky Way, near the Scorpion.']},
DUTCH:{t:'A constellation of the navigators',p:[
 'This constellation was named around the year 1600, from the observations of Dutch navigators sailing to the East Indies, today’s Indonesia.',
 'Europeans had never seen the southern sky before, so they named new constellations after the strange animals they met on their voyages, such as the peacock, the toucan, the crane and the flying fish.',
 'So it has no ancient legend, but it carries the story of adventure at sea.']},
LACAILLE:{t:'A constellation of scientific instruments',p:[
 'Nicolas-Louis de Lacaille, a French astronomer, named this constellation around 1750 while observing the sky from the Cape of Good Hope in South Africa.',
 'He mapped about ten thousand southern stars and liked to name new constellations after instruments of science and art, such as the telescope, the microscope, the clock and the air pump.',
 'These constellations are like a memorial to the age of scientific discovery.']},
HEVELIUS:{t:'A constellation that fills the gaps',p:[
 'Johannes Hevelius, a Polish astronomer, named this constellation in a star atlas published in 1690.',
 'He wanted to fill the gaps between the ancient constellations, so most of their stars are rather faint.',
 'It is said that he named the Lynx because you need eyes as sharp as a lynx to see it.']},
ANCIENT:{t:'An ancient constellation',p:[
 'This is one of the 48 ancient constellations recorded by the astronomer Ptolemy almost two thousand years ago.',
 'People in those days used the stars to tell the time, the seasons and directions, long before clocks and compasses.']},
GENERIC:{t:'One of the 88 official constellations',p:[
 'The whole sky is divided into 88 constellations by the International Astronomical Union, much like a world map divided into countries.',
 'So every point in the sky always belongs to one constellation or another.']}
};

const BODY_MYTH_EN={
 Sun:{t:'The Sun, our star',p:['The Sun is the star closest to Earth. Its light takes about eight minutes to reach us.','In Greek myth, the god Helios drove the chariot of the Sun across the sky from east to west every day.','In Thai tradition, Sunday belongs to the Sun, and its colour is red.','Warning: never look at the Sun with your naked eye, binoculars or a telescope. It can cause blindness.']},
 Moon:{t:'The rabbit on the Moon',p:['Thai people see a rabbit on the Moon, from a Jataka tale.','A rabbit had no food to offer a hungry holy man, so it jumped into a fire to offer its own body as food.','The holy man was really the god Indra in disguise, testing its kindness. He drew the rabbit on the Moon so everyone would remember its sacrifice.','The Moon orbits Earth about once a month, which is why we see its phases change every night.','In Thai tradition, Monday belongs to the Moon, and its colour is yellow.']},
 Mercury:{t:'Mercury, messenger of the gods',p:['Mercury is named after the Roman messenger god, the fastest traveller, because it orbits the Sun fastest of all, in only about 88 days.','Mercury is very close to the Sun, so it can only be seen low near the horizon just after sunset or before dawn.','In Thai tradition, Wednesday belongs to Mercury, and its colour is green.']},
 Venus:{t:'Venus, the morning and evening star',p:['Venus is named after the Roman goddess of love and beauty, because it is the most beautiful bright object in the sky after the Moon.','Thai people call Venus at dawn “Dao Prakai Phruek”, the morning star, and Venus at dusk “Dao Prachammueang”, the evening star.','Venus is the hottest planet in the Solar System, because its thick atmosphere traps heat.','In Thai tradition, Friday belongs to Venus, and its colour is blue.']},
 Mars:{t:'Mars, the red planet',p:['Mars is named after the Roman god of war, because it is red like blood and fire.','Its red colour comes from dust full of iron oxide, which is rust.','Mars has the volcano Olympus Mons, about two and a half times taller than Mount Everest.','In Thai tradition, Tuesday belongs to Mars, and its colour is pink.']},
 Jupiter:{t:'Jupiter, king of the planets',p:['Jupiter is named after the king of the Roman gods, because it is the largest planet in the Solar System, big enough to hold more than a thousand Earths.','Through binoculars you can see four little dots beside it: the moons Galileo discovered in 1610.','In Thai tradition, Thursday belongs to Jupiter, and its colour is orange.']},
 Saturn:{t:'Saturn, lord of the rings',p:['Saturn is named after the Roman god of farming.','Saturn has beautiful rings made of countless chunks of ice and rock, visible through a small telescope.','Saturn is so light for its size that it would float, if you had a bathtub big enough.','In Thai tradition, Saturday belongs to Saturn, and its colour is purple.']},
 Uranus:{t:'Uranus, the planet that rolls on its side',p:['Uranus is named after the Greek god of the sky.','William Herschel discovered it with a telescope in 1781, the first planet discovered in modern times.','Its axis is tilted so much that it seems to roll around the Sun on its side.']},
 Neptune:{t:'Neptune, found by mathematics',p:['Neptune is named after the Roman god of the sea, because it is deep blue like the ocean.','Astronomers noticed that the orbit of Uranus was strange, and used mathematics to predict another planet pulling on it. Neptune was found in 1846, right where they calculated.','Neptune is too far away to see with the naked eye. You need a telescope.']}
};

// ===================== 星座传说 — 简体中文 =====================
const MYTHS_ZH={
ORION:{t:'猎户俄里翁：永远遇不到天蝎的猎人',p:[
 '很久很久以前，希腊神话中有一位巨人猎手，名叫俄里翁。他是海神波塞冬的儿子。',
 '俄里翁打猎的本领高强，没有一只野兽能逃出他的手掌。有一天，他夸口说要把地球上所有的动物都猎光。',
 '大地女神盖亚听了非常生气，派出一只巨大的蝎子，把俄里翁蜇死了。',
 '众神把猎人和蝎子都升上了天空，却让他们分别待在天空的两端。',
 '当天蝎座从东方升起时，猎户座就从西方落下，所以它们几乎从不同时出现在天空中。',
 '中国古人也有类似的说法：猎户座的参宿和天蝎座的心宿（古称“商星”）此起彼落，永不相见，这就是成语“参商不相见”的由来。',
 '在泰国，人们把猎户腰带上的三颗星和下方的星连起来，叫作“犁星”，就像农民耕地用的犁。',
 '找一找肩膀上橙红色的参宿四和脚下蓝白色的参宿七吧。它们颜色不同，说明这两颗星的温度不一样。']},
SCORPIUS:{t:'追赶猎人的天蝎',p:[
 '在希腊神话中，这就是大地女神盖亚派去阻止猎人俄里翁的巨蝎，因为俄里翁夸口要猎光地球上所有的动物。',
 '巨蝎蜇死了俄里翁。众神把他们都升上天空，却让他们各在一方。',
 '直到今天，天蝎座从东方升起时，猎户座便沉入西方地平线，好像还在躲避天蝎一样。',
 '天蝎的心脏是心宿二，一颗红超巨星。中国古人叫它“大火”；它的西方名字安塔瑞斯意思是“火星的对手”，因为两者都是红色的。',
 '在泰国，每年五月到八月的傍晚，可以在南方天空清楚地看到天蝎座。找找看那条弯成钩子形状的尾巴吧。']},
UMA:{t:'卡利斯托：天上的熊妈妈',p:[
 '在希腊神话中，卡利斯托是一位美丽的仙女，她和宙斯生了一个儿子，名叫阿卡斯。',
 '宙斯的妻子赫拉心生嫉妒，把卡利斯托变成了一头熊。她只能孤零零地在森林里流浪。',
 '许多年后，阿卡斯长成了一名猎人。有一天，他在森林里遇到一头熊，正要拉弓射箭，却不知道这头熊就是自己的母亲。',
 '宙斯看见了，就把阿卡斯也变成一头小熊，然后抓住两只熊的尾巴，把它们甩上了天空。所以天上的熊尾巴才会那么长。',
 '大熊座里最有名的七颗星就是北斗七星，排成一把勺子的形状。中国古人用斗柄的指向来判断季节：“斗柄东指，天下皆春”。',
 '在泰国，人们把北斗七星叫作“鳄鱼星”。',
 '小窍门：沿着勺口的两颗星向外延长大约五倍的距离，就能找到北极星。']},
UMI:{t:'小熊和北极星',p:[
 '希腊神话说，小熊就是卡利斯托的儿子阿卡斯。宙斯把他变成熊，放在天上妈妈的身边。',
 '小熊尾巴的尖端就是北极星，它几乎正好位于北天极。',
 '其他星星整夜绕着天空旋转，北极星却几乎不动。几百年来，旅行者和航海家都靠它来辨认北方。',
 '北极星离地平线的高度等于你所在地的纬度。在曼谷，它很低，只有大约14度，要在北方没有建筑物遮挡的地方才能看到。']},
LYRA:{t:'俄耳甫斯的竖琴与织女',p:[
 '在希腊神话中，俄耳甫斯是世界上最伟大的音乐家。他一弹起竖琴，连树木和石头都会随着音乐摇摆。',
 '有一天，他深爱的妻子欧律狄刻被毒蛇咬伤，不幸去世。俄耳甫斯便独自前往冥界。',
 '他的琴声打动了冥王哈迪斯。冥王答应让他带妻子回去，但有一个条件：在回到人间之前，绝对不能回头看。',
 '快到出口时，俄耳甫斯忍不住回头看了一眼。欧律狄刻就永远消失在冥界之中了。',
 '俄耳甫斯死后，众神把他的竖琴放到了天上。',
 '在中国传说中，天琴座最亮的星——织女星，就是天上的织女。她爱上了人间的牛郎，也就是牛郎星。',
 '银河把他们隔在两岸，每年只有在农历七月初七的晚上，喜鹊们飞来搭成鹊桥，他们才能在桥上相会。这一天就是七夕节。']},
AQUILA:{t:'宙斯的神鹰与牛郎',p:[
 '在希腊神话中，这只老鹰是宙斯的伙伴，负责为宙斯携带威力无比的雷电。',
 '有一次，宙斯派老鹰飞到人间，把一位名叫伽倪墨得斯的牧羊少年接到奥林匹斯山上，为众神斟酒。',
 '天鹰座最亮的星是牛郎星，中国古称“河鼓二”。在中国传说中，他是织女（织女星）的爱人。',
 '牛郎星两旁的两颗小星，传说是牛郎挑着的一对儿女。他们和织女隔着银河，每年七夕才能相会一次。',
 '牛郎星、织女星和天津四组成“夏季大三角”，七月到十月的傍晚很容易看到。']},
CYGNUS:{t:'忠诚的天鹅',p:[
 '在希腊神话中，太阳神的儿子法厄同借了太阳车去驾驶，却控制不住拉车的神马。宙斯不得不用雷电击中他，法厄同坠入了厄里达诺斯河。',
 '法厄同最好的朋友库克诺斯一次又一次地潜入河中寻找他，从不放弃。',
 '众神被他的忠诚感动，把库克诺斯变成一只天鹅，放到了天上。',
 '天鹅座正好飞翔在银河之上，它的星星排成十字形，所以又叫“北十字”。',
 '天鹅的尾巴是天津四，一颗距离我们非常遥远的巨星，却依然亮得用肉眼就能看见。']},
TAURUS:{t:'宙斯的白牛与昴星团',p:[
 '在希腊神话中，宙斯变成一头温顺的白牛，接近正在海边玩耍的公主欧罗巴。',
 '公主骑上牛背后，白牛便游过大海，把她带到了克里特岛。欧洲（Europe）这个名字就来自这位公主。',
 '公牛的眼睛是橙色的毕宿五。牛背上有一小群星星，就是昴星团，中国古称“昴宿”，泰国人叫它“小鸡星”。',
 '泰国有一个传说：一对老夫妇养了一只母鸡和一群小鸡。有一天，一位云游的僧人来到村里，老夫妇没有东西可以做饭供养他，便打算杀掉母鸡。',
 '母鸡知道后，伤心地和小鸡们告别。母鸡被杀后，六只小鸡出于对妈妈的爱，也一起跳进了火堆。',
 '天神被它们的孝心感动，把母鸡和小鸡都升上天空，成为昴星团，让它们永远在一起。']},
CMA:{t:'猎人的猎犬与最亮的恒星',p:[
 '在希腊神话中，大犬是猎人俄里翁忠实的猎犬，每天晚上都跟着主人在天空中奔跑。',
 '另一个故事说，有一只名叫莱拉普斯的猎犬，没有猎物能逃过它。它被派去追捕一只谁也抓不到的狐狸。',
 '这场追逐永远不会结束，于是宙斯把它们都变成了石头，并把猎犬放到了天上。',
 '猎犬嘴边的那颗星就是天狼星，夜空中最亮的恒星，距离地球大约8.6光年。',
 '古埃及人发现，每当天狼星在黎明前和太阳一起升起，尼罗河就快要泛滥了。',
 '小窍门：沿着猎户座腰带的三颗星向左下方延长，就能找到天狼星。']},
CMI:{t:'猎人的小狗',p:[
 '小犬是俄里翁的另一只猎犬，紧紧跟在大犬的后面。',
 '它最亮的星是南河三，西方名字的意思是“在狗之前”，因为它总比天狼星早一点点升起。',
 '南河三、天狼星和参宿四组成“冬季大三角”，十二月到三月的傍晚很容易看到。']},
GEMINI:{t:'形影不离的双胞胎',p:[
 '在希腊神话中，卡斯托尔和波吕克斯是一对感情很好的双胞胎兄弟。卡斯托尔是普通的凡人，波吕克斯却是宙斯的儿子，长生不死。',
 '兄弟俩总是一起冒险，还一起登上阿尔戈号，去寻找金羊毛。',
 '卡斯托尔在战斗中死去后，波吕克斯悲痛万分，请求宙斯把自己的不死之身分一半给哥哥。',
 '宙斯被兄弟之情感动，把他们一起放到天上，永远并肩相伴。',
 '古代的水手把这对双胞胎当作航海的守护神。',
 '找一找两颗靠得很近的亮星，那就是双胞胎的头——北河二和北河三。']},
LEO:{t:'涅墨亚雄狮',p:[
 '在希腊神话中，涅墨亚雄狮是一头可怕的怪兽，它的皮坚韧无比，刀剑、长矛和弓箭都伤不了它。',
 '最强壮的英雄赫拉克勒斯接到了十二项任务中的第一项：制服这头雄狮。',
 '武器不起作用，赫拉克勒斯就徒手和雄狮搏斗，最终勒住它的脖子获胜，还把狮皮披在身上当作铠甲。',
 '后来，天后赫拉把这头狮子放到了天上。',
 '狮子的头部像一把镰刀，也像一个反写的问号。镰刀底部的亮星是轩辕十四，西方名字的意思是“小国王”。']},
VIRGO:{t:'丰收与四季女神',p:[
 '希腊人把室女座和农业女神得墨忒耳以及她的女儿珀耳塞福涅联系在一起。',
 '有一天，冥王哈迪斯把珀耳塞福涅抢到冥界做王后。得墨忒耳悲伤至极，全世界的植物都枯萎了。',
 '宙斯命令哈迪斯把珀耳塞福涅送回来，但因为她在冥界吃了几颗石榴籽，每年都必须回冥界住上一段时间。',
 '女儿离开的时候，母亲伤心，大地变得寒冷，这就是冬天；女儿回来时，花儿盛开，这就是春天。',
 '室女座最亮的星是角宿一，西方名字的意思是“麦穗”，就是少女手中拿着的那一束。']},
BOOTES:{t:'赶熊的人',p:[
 '牧夫座的形状像一只风筝，或者一个冰淇淋甜筒。希腊人把他看作一个不停赶着大熊绕北天极转圈的人。',
 '它最亮的星是大角星，西方名字的意思是“守熊人”。它是一颗橙色巨星，是夜空中第四亮的恒星。',
 '小窍门：沿着北斗七星斗柄的弧线延伸，就能找到大角星；继续沿弧线往前，就是室女座的角宿一。']},
SGR:{t:'半人马射手',p:[
 '希腊人把人马座看成一位正在拉弓的半人马。他的箭对准天蝎的心脏心宿二，好像在保护天空免受天蝎的侵扰。',
 '现在很多人把它的亮星看成一把“茶壶”，有壶嘴、壶柄和壶盖。中国古代的“南斗六星”也在这里。',
 '从壶嘴冒出的“蒸汽”是银河的光芒，因为这个方向正指向我们银河系的中心。',
 '银河系中心有一个超大质量黑洞，质量大约是太阳的四百万倍。']},
PERSEUS:{t:'英雄珀耳修斯与安德洛墨达公主',p:[
 '在希腊神话中，王后卡西奥佩娅夸口说，她和女儿安德洛墨达公主比海中的仙女们还要美丽。',
 '海神波塞冬勃然大怒，派出海怪刻托去毁坏王国。',
 '国王刻甫斯得到神谕，必须把安德洛墨达献给海怪。于是，公主被铁链锁在海边的岩石上。',
 '这时，英雄珀耳修斯刚刚打败美杜莎——一个满头蛇发、谁看她一眼就会变成石头的女妖。他飞过海边，看见了身处危险的公主。',
 '海怪刻托从海里冒出来时，珀耳修斯举起美杜莎的头，海怪立刻变成了石头。他救下了安德洛墨达，两人结为夫妻。',
 '长着翅膀的飞马珀伽索斯是在美杜莎被打败时诞生的。所以这个故事里的所有角色，在天空中都离得很近：国王、王后、公主、英雄、飞马和海怪。',
 '王后卡西奥佩娅受到惩罚，要坐在绕着北天极旋转的宝座上，所以有时候她会头朝下倒挂着。',
 '英仙座里的大陵五被看作美杜莎的眼睛，它的亮度大约每2.9天就会变暗一次。']},
ARGO:{t:'阿尔戈号与金羊毛',p:[
 '在希腊神话中，伊阿宋接到一项任务：取回金羊毛，才能夺回被篡夺的王位。',
 '他造了一艘大船，名叫阿尔戈号，召集了大约五十位英雄，称为阿尔戈英雄，其中有赫拉克勒斯、俄耳甫斯，还有双胞胎卡斯托尔和波吕克斯。',
 '他们经历了许多危险，比如会互相撞击的巨岩，还有守护金羊毛、永不睡觉的巨龙，最终完成了任务。',
 '阿尔戈号被放到了天上。它原本是一个非常大的星座，后来天文学家把它分成了三个：船底座、船尾座和船帆座。',
 '船底座的老人星是全天第二亮的恒星。中国人称它为“南极老人星”，象征长寿。在泰国，它出现在南方低空。']},
ARIES:{t:'金毛公羊',p:[
 '在希腊神话中，王子佛里克索斯和公主赫勒遭到狠心继母的陷害。',
 '一只长着金色羊毛的神奇公羊飞来，驮着兄妹俩飞越大海。途中赫勒不慎落入海中，佛里克索斯则平安到达了科尔基斯。',
 '金羊毛被挂在一片圣林里，由巨龙看守，直到伊阿宋和阿尔戈英雄们前来把它取走。',
 '那只公羊则被放到天上，成为白羊座，也是黄道十二星座之一。']},
HYDRA:{t:'九头蛇许德拉',p:[
 '许德拉是一条长着许多脑袋的巨大水蛇。最可怕的是，砍掉它一个头，就会长出两个新头。',
 '赫拉克勒斯奉命去消灭它。他的侄子伊俄拉俄斯用火把烧灼每个断口，新头就长不出来了，两人终于获胜。',
 '长蛇座是88个星座中最大的一个，横跨了将近四分之一的天空。',
 '它最亮的星是星宿一，西方名字的意思是“孤独者”，因为附近没有其他亮星。']},
CANCER:{t:'勇敢的螃蟹',p:[
 '赫拉克勒斯和九头蛇搏斗的时候，讨厌他的天后赫拉派了一只巨蟹去夹他的脚。',
 '赫拉克勒斯一脚把螃蟹踩碎了，但赫拉赞赏它的勇气，就把它放到了天上。',
 '巨蟹座的星星都很暗，但中间有一个蜂巢星团，中国古称“积尸气”。在非常黑暗的地方，用肉眼能看到一小团模糊的光。']},
HERCULES:{t:'赫拉克勒斯与十二项任务',p:[
 '赫拉克勒斯（罗马人叫他海格力斯）是宙斯的儿子，还是婴儿时就力大无穷。',
 '为了弥补一次严重的过错，他必须完成十二项几乎不可能的任务，比如制服涅墨亚雄狮、消灭九头蛇，以及取回有巨龙看守的金苹果。',
 '赫拉克勒斯死后，宙斯把他升上天空。他曾经打败的许多怪兽也都在天上：狮子、九头蛇、螃蟹和巨龙。',
 '在天空中，武仙呈跪姿，身体部位有四颗星组成一个四边形。附近还有一个由几十万颗恒星组成的球状星团。']},
DRACO:{t:'守护金苹果的巨龙',p:[
 '在希腊神话中，拉冬是一条永不睡觉的巨龙，守护着仙女们花园里的金苹果树。',
 '赫拉克勒斯的十二项任务之一就是取回金苹果。有的故事说，他打败了这条巨龙。',
 '天后赫拉把巨龙放到了天上，它的身体蜿蜒在大熊座和小熊座之间。',
 '大约五千年前，天龙座的右枢曾经是北极星，因为地球的自转轴会随着时间慢慢摆动。']},
OPH:{t:'能让人起死回生的神医',p:[
 '在希腊神话中，阿斯克勒庇俄斯是太阳神阿波罗的儿子，他跟随博学的半人马喀戎学习医术。',
 '有一天，他看见一条蛇叼来草药，救活了另一条蛇，阿斯克勒庇俄斯由此学会了让死人复活的方法。',
 '冥王哈迪斯很不高兴，因为再也没有灵魂来到冥界了。于是宙斯用雷电击中了阿斯克勒庇俄斯。',
 '后来宙斯念及他的功德，把他升上天空，成为蛇夫座，手里握着巨蛇座。',
 '直到今天，一根缠着蛇的手杖仍然是医学的标志。']},
AURIGA:{t:'御夫与母山羊',p:[
 '在希腊神话中，御夫是雅典国王厄里克托尼俄斯，他发明了四匹马拉的战车。宙斯十分赞赏，把他升上了天空。',
 '御夫怀里抱着一只母山羊。五车二的西方名字意思是“小母山羊”，她就是在宙斯婴儿时期用奶水喂养他的山羊阿玛尔忒亚。',
 '五车二是一颗和太阳相似的黄色恒星，是夜空中第六亮的星。']},
CENTAURUS:{t:'半人马老师喀戎',p:[
 '希腊神话中的半人马大多粗野，但喀戎与众不同。他聪明、善良，精通医术、音乐和射箭。',
 '喀戎是许多英雄的老师，比如赫拉克勒斯、阿喀琉斯和伊阿宋。',
 '有一天，喀戎不小心被沾有九头蛇毒血的箭射中。他痛苦万分，却因为长生不死而无法解脱。',
 '喀戎最终选择放弃永生。宙斯敬重他的善良，把他升上天空，成为半人马座。',
 '半人马的脚下是南门二，它是离太阳系最近的恒星系统，距离只有大约4.4光年。']},
CRUX:{t:'南十字：南方海洋的指路星',p:[
 '南十字座是88个星座中最小的一个，但它有四颗亮星排成十字形。',
 '南半球的水手用它来寻找南方，因为十字架的长轴指向南天极。',
 '澳大利亚、新西兰和巴西等国家的国旗上都有南十字的图案。',
 '澳大利亚原住民把南十字附近银河中的暗区看作天上一只巨大鸸鹋的头。',
 '在泰国，三月到五月的傍晚朝南方望去，可以看到南十字低低地挂在地平线上方。']},
AQR:{t:'为众神斟酒的伽倪墨得斯',p:[
 '在希腊神话中，伽倪墨得斯是最英俊的牧羊少年。',
 '宙斯派老鹰把他接到奥林匹斯山上，为众神斟上琼浆玉液。',
 '在天空中，伽倪墨得斯正从水瓶里倒水，水流一直流进南鱼座的嘴里。',
 '这片天空有许多和水有关的星座：双鱼、鲸鱼、摩羯和海豚。古人把这一带叫作“海洋”。']},
CAP:{t:'半羊半鱼的潘神',p:[
 '在希腊神话中，可怕的巨人提丰曾经攻击众神，众神纷纷变成动物逃跑。',
 '长着羊腿的潘神慌忙跳进河里，泡在水下的部分变成了鱼尾，露出水面的部分还是山羊。',
 '宙斯觉得这个样子又滑稽又可爱，就把它放到天上，成为摩羯座。',
 '摩羯座的星星不太亮，组成一个像小船、也像笑脸的三角形。']},
PSC:{t:'用绳子系在一起的两条鱼',p:[
 '在希腊神话中，爱神阿佛洛狄忒和她的儿子厄洛斯正在躲避巨人提丰。',
 '他们跳进河里变成了鱼，还用一根绳子把彼此系在一起，免得失散。',
 '所以在天上，我们看到两条鱼朝不同方向游，中间用一根绳子连着。',
 '双鱼座是黄道星座，星星很暗，要在黑暗的地方才看得清楚。']},
PSA:{t:'喝水的南鱼',p:[
 '南鱼座是一条张着嘴喝水的鱼，水是从宝瓶座的水瓶里流下来的。',
 '鱼嘴上的星是北落师门，西方名字的意思就是“鱼的嘴”。',
 '北落师门是南方天空中一颗孤零零的亮星，九月到十一月的傍晚很容易找到。']},
LIBRA:{t:'正义的天秤',p:[
 '天秤座被看作正义女神手中的天平，就在室女座的旁边。',
 '在古代，这几颗星曾被看作天蝎的螯，所以有的星的阿拉伯名字至今的意思还是“南螯”和“北螯”。',
 '天秤座是黄道星座中唯一一个是物品，而不是人或动物的星座。']},
DELPHINUS:{t:'做媒的海豚',p:[
 '在希腊神话中，海神波塞冬爱上了海中仙女安菲特里忒，可她十分害羞，躲了起来。',
 '一只海豚游遍大海找到了她，劝她回来嫁给波塞冬。',
 '波塞冬非常感激，就把这只海豚放到了天上。',
 '海豚座小巧可爱，四颗星组成一个小菱形，像海豚的身体，还伸出一条尾巴。中国古人称这四颗星为“瓠瓜”。']},
LEPUS:{t:'猎人脚下的野兔',p:[
 '天兔座正好在猎户俄里翁的脚下。希腊人把它看作正被猎人追赶的野兔。',
 '猎人的大犬也在旁边追着它，所以这只兔子每天晚上都得在天上不停地奔跑。']},
ERIDANUS:{t:'天上的河流',p:[
 '波江座就是厄里达诺斯河，法厄同驾驶太阳车失控后坠入的那条河。',
 '这条河弯弯曲曲非常长，从猎户的脚边开始，一直流到南方的天空。',
 '河的尽头是水委一，西方名字的意思是“河的尽头”。']},
CROW:{t:'乌鸦和水杯',p:[
 '在希腊神话中，太阳神阿波罗派一只乌鸦拿着杯子去取水。',
 '半路上乌鸦看见一棵无花果树，就停下来等果子成熟，吃得饱饱的，等它想起来时已经很晚了。',
 '于是乌鸦抓来一条水蛇，对阿波罗撒谎说是这条蛇挡住了泉水。',
 '阿波罗识破了谎言，惩罚了它，把乌鸦、杯子和水蛇都放到天上，还让长蛇座隔在中间，让乌鸦永远喝不到杯里的水。']},
SAGITTA:{t:'赫拉克勒斯的箭',p:[
 '在希腊神话中，普罗米修斯从天上盗火给人类。宙斯惩罚他，把他锁在山崖上，每天派一只老鹰来啄食他的肝脏。',
 '赫拉克勒斯路过这里，一箭射死了老鹰，救出了普罗米修斯。',
 '那支箭被放到了天上，成为天鹰座附近的一个小星座——天箭座。']},
CRB:{t:'阿里阿德涅公主的王冠',p:[
 '在希腊神话中，公主阿里阿德涅送给忒修斯一团线，让他边走边放，帮他从牛头怪的迷宫中逃了出来。',
 '可是后来，忒修斯却把她独自留在了纳克索斯岛上。',
 '酒神狄俄尼索斯发现了阿里阿德涅，娶她为妻，并送给她一顶镶满宝石的王冠作为结婚礼物。',
 '后来王冠被抛向天空，宝石变成了星星，排成一个美丽的半圆形。中国古人把它叫作“贯索”。']},
COMA:{t:'贝勒尼基王后的秀发',p:[
 '这个星座来自古埃及的一个真实故事。王后贝勒尼基向众神许愿：如果丈夫能从战场上平安归来，她就剪下自己美丽的长发献给众神。',
 '国王回来后，王后剪下头发供奉在神庙里，可是第二天，头发竟然不见了。',
 '宫廷天文学家告诉她，众神非常高兴，已经把她的头发放到天上去了。',
 '后发座是一团暗淡的星星，闪闪烁烁，就像一缕缕发丝。']},
ARA:{t:'众神的祭坛',p:[

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
let LANG=(()=>{try{const v=localStorage.getItem('sf_lang');if(LANGS.includes(v))return v}catch(e){}const n=(navigator.language||'th').toLowerCase();return n.startsWith('zh')?'zh':n.startsWith('th')?'th':'en'})();
const L=()=>UI[LANG];
if(!window.Astronomy){document.body.innerHTML='<p style="padding:24px">'+L().libFail+'</p>';return}
const A=window.Astronomy;
const D2R=Math.PI/180,R2D=180/Math.PI;
const wrap360=a=>((a%360)+360)%360, wrap180=a=>((a+540)%360)-180;
const cv=$('sky'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;

const BODIES=[['Sun','ดวงอาทิตย์','#ffd34d',11],['Moon','ดวงจันทร์','#f3efdc',10],['Mercury','ดาวพุธ','#d8c8b4',3.5],['Venus','ดาวศุกร์','#fff4c2',5],['Mars','ดาวอังคาร','#ff8a5c',4.2],['Jupiter','ดาวพฤหัสบดี','#f2d7a7',5],['Saturn','ดาวเสาร์','#e8d08f',4.5],['Uranus','ดาวยูเรนัส','#a8e6ef',3],['Neptune','ดาวเนปจูน','#8fb2ff',3]];
const CARD=[['N',0,1],['NE',45],['E',90,1],['SE',135],['S',180,1],['SW',225],['W',270,1],['NW',315]];
const latin=id=>CON_INFO[id]?CON_INFO[id][0]:id;
const conLabel=id=>L().conLabel(id,latin(id)), conWord=id=>L().conWord(id,latin(id)), conHead=id=>L().conHead(id,latin(id));
const starLabel=name=>L().star(name);
const bn=name=>BODY_NAME[LANG][name]||name;
const LORE_I18N={th:LORE,en:LORE_EN,zh:LORE_ZH};
const MY={th:MYTHS,en:MYTHS_EN,zh:MYTHS_ZH},LEADS={en:LEAD_EN,zh:LEAD_ZH},BODYM={th:BODY_MYTH,en:BODY_MYTH_EN,zh:BODY_MYTH_ZH};

// ---------------- สถานะ ----------------
const st={lat:13.7563,lon:100.5018,gps:false,timeOffsetMin:0,vfov:62,
  sensorOn:false,lastSensor:0,gotAbs:false,kind:'',iosOff:null,iosGood:false,calib:0,
  manAz:135,manAlt:35,grid:false,cam:false,target:''};
try{const s=JSON.parse(localStorage.getItem('sf_loc')||'null');if(s&&isFinite(s.lat)){st.lat=s.lat;st.lon=s.lon}}catch(e){}
let observer=new A.Observer(st.lat,st.lon,0);
const now=()=>new Date(Date.now()+st.timeOffsetMin*60000);

// ---------------- เตรียมเวกเตอร์ J2000 ----------------
function eqj(raDeg,decDeg){const r=raDeg*D2R,d=decDeg*D2R,c=Math.cos(d);return [c*Math.cos(r),c*Math.sin(r),Math.sin(d)]}
const NS=STARS.length;
const starEQ=new Float64Array(NS*3);STARS.forEach((s,i)=>{const v=eqj(s[0],s[1]);starEQ.set(v,i*3)});
const starCol=STARS.map(s=>{const b=s[3];return b<0?'#b4ceff':b<0.35?'#e6eeff':b<0.7?'#fff7e6':b<1.15?'#ffe3b5':'#ffc890'});
const conIds=Object.keys(CON_LINES);
const linesEQ=conIds.map(id=>CON_LINES[id].map(l=>l.map(p=>eqj(p[0],p[1]))));
const mwKeys=['ol1','ol2','ol3'];
const mwEQ=mwKeys.map(k=>(MILKYWAY[k]||[]).map(poly=>poly.map(p=>eqj(p[0],p[1]))));
const lblIds=Object.keys(CON_INFO);
const lblEQ=lblIds.map(id=>eqj(CON_INFO[id][1],CON_INFO[id][2]));
const brightStars=[];for(const k in STAR_NAMES){const i=+k;if(STARS[i][2]<1.6||STAR_NAMES[k]==='Polaris')brightStars.push(i)}
// เส้นกริด (แนวราบ)
const grid=[];
for(const alt of [0,30,60]){const l=[];for(let az=0;az<=360;az+=5)l.push(enuFromAzAlt(az,alt));grid.push(l)}
for(let az=0;az<360;az+=30){const l=[];for(let alt=-10;alt<=88;alt+=4)l.push(enuFromAzAlt(az,alt));grid.push(l)}
function enuFromAzAlt(az,alt){const a=az*D2R,h=alt*D2R;return [Math.cos(h)*Math.sin(a),Math.cos(h)*Math.cos(a),Math.sin(h)]}
function azAltFromEnu(v){return {az:wrap360(Math.atan2(v[0],v[1])*R2D),alt:Math.asin(Math.max(-1,Math.min(1,v[2])))*R2D}}

// ---------------- คำนวณตำแหน่งบนท้องฟ้า (Astronomy Engine) ----------------
let sky={},lastSky=0,skyDirty=true;
function eqjToEnu(m,v,out,o,refr){
  const x=m[0][0]*v[0]+m[1][0]*v[1]+m[2][0]*v[2];   // ทิศเหนือ
  const y=m[0][1]*v[0]+m[1][1]*v[1]+m[2][1]*v[2];   // ทิศตะวันตก
  let z=m[0][2]*v[0]+m[1][2]*v[1]+m[2][2]*v[2];     // จุดเหนือศีรษะ
  let e=-y,n=x;
  if(refr&&z>-0.03){const alt=Math.asin(z)*R2D,alt2=alt+A.Refraction('normal',alt),h=Math.hypot(e,n);if(h>1e-9){const k=Math.cos(alt2*D2R)/h;e*=k;n*=k}z=Math.sin(alt2*D2R)}
  out[o]=e;out[o+1]=n;out[o+2]=z;
}
function computeSky(){
  const t=A.MakeTime(now());
  const rot=A.Rotation_EQJ_HOR(t,observer).rot;
  const stars=new Float64Array(NS*3);
  for(let i=0;i<NS;i++)eqjToEnu(rot,starEQ.subarray(i*3,i*3+3),stars,i*3,true);
  const lines=linesEQ.map(con=>con.map(l=>{const a=new Float64Array(l.length*3);l.forEach((v,j)=>eqjToEnu(rot,v,a,j*3,true));return a}));
  const mw=mwEQ.map(layer=>layer.map(poly=>{const a=new Float64Array(poly.length*3);poly.forEach((v,j)=>eqjToEnu(rot,v,a,j*3,false));return a}));
  const lbl=new Float64Array(lblIds.length*3);lblEQ.forEach((v,i)=>eqjToEnu(rot,v,lbl,i*3,false));
  const bodies=BODIES.map(([name,th,col,r])=>{
    const b=A.Body[name];
    const eq=A.Equator(b,t,observer,true,true);
    const hor=A.Horizon(t,observer,eq.ra,eq.dec,'normal');
    let mag=null;try{if(name!=='Sun')mag=A.Illumination(b,t).mag}catch(e){}
    return {name,th,col,r,az:hor.azimuth,alt:hor.altitude,v:enuFromAzAlt(hor.azimuth,hor.altitude),mag};
  });
  const sun=bodies[0];
  sky={t,rot,horEqj:A.Rotation_HOR_EQJ(t,observer).rot,stars,lines,mw,lbl,bodies,sunAlt:sun.alt,moonPhase:A.MoonPhase(t)};
  lastSky=Date.now();skyDirty=false;riseCache={};
}

// ---------------- เซนเซอร์ → เมทริกซ์มุมมอง ----------------
// เมทริกซ์ R (อุปกรณ์ → ENU) ตามนิยาม W3C: R = Rz(alpha)·Rx(beta)·Ry(gamma)
function euler(a,b,g){
  a*=D2R;b*=D2R;g*=D2R;
  const cA=Math.cos(a),sA=Math.sin(a),cB=Math.cos(b),sB=Math.sin(b),cG=Math.cos(g),sG=Math.sin(g);
  return [[cA*cG-sA*sB*sG,-sA*cB,cA*sG+sA*sB*cG],
          [sA*cG+cA*sB*sG, cA*cB,sA*sG-cA*sB*cG],
          [-cB*sG,         sB,   cB*cG]];
}
const col=(m,j)=>[m[0][j],m[1][j],m[2][j]];
function screenAngle(){let a=0;if(screen.orientation&&typeof screen.orientation.angle==='number')a=screen.orientation.angle;else if(typeof window.orientation==='number')a=window.orientation;return a||0}
// มุมมองปัจจุบัน: r = ขวาจอ, u = บนจอ, f = ทิศที่กล้องหลังชี้ (ทั้งหมดในพิกัด ENU)
let view={r:[1,0,0],u:[0,0,1],f:[0,1,0]},target=null;
function setTargetFromMatrix(m){
  const th=screenAngle()*D2R,c=Math.cos(th),s=Math.sin(th);
  const X=col(m,0),Y=col(m,1),Z=col(m,2);
  const r=[0,1,2].map(i=>X[i]*c-Y[i]*s), u=[0,1,2].map(i=>X[i]*s+Y[i]*c), f=Z.map(v=>-v);
  target={r:rotUp(r,st.calib),u:rotUp(u,st.calib),f:rotUp(f,st.calib)};
}
function rotUp(v,d){ // หมุนรอบแกนตั้ง ให้ทิศ (azimuth) เพิ่มขึ้น d องศา
  const a=d*D2R,c=Math.cos(a),s=Math.sin(a);return [v[0]*c+v[1]*s,-v[0]*s+v[1]*c,v[2]];
}
function manualTarget(){
  const f=enuFromAzAlt(st.manAz,st.manAlt),a=st.manAz*D2R,r=[Math.cos(a),-Math.sin(a),0];
  target={r,u:cross(r,f),f};
}
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};
function onOrient(e,isAbs){
  if(!st.sensorOn||e.beta==null)return;
  let a=e.alpha||0;const b=e.beta,g=e.gamma||0;
  const ch=e.webkitCompassHeading;
  if(typeof ch==='number'&&ch>=0&&!isNaN(ch)){ // iPhone: alpha ไม่ได้อ้างอิงทิศเหนือ → ใช้ webkitCompassHeading หาค่าชดเชย
    st.kind='ios';
    const portrait=screenAngle()===0;
    let sample=null,good=false;
    if(portrait&&Math.abs(b)<70&&Math.abs(g)<30){sample=wrap180((360-ch)-a);good=true}           // ทิศขอบบนเครื่อง = -alpha
    else if(!st.iosGood){const m=euler(a,b,g),fh=Math.atan2(-m[0][2],-m[1][2])*R2D;sample=wrap180(ch-fh)*-1} // ชั่วคราว: ถือว่าเป็นทิศกล้อง
    if(sample!==null){
      if(st.iosOff===null||(good&&!st.iosGood))st.iosOff=sample;
      else st.iosOff=wrap180(st.iosOff+wrap180(sample-st.iosOff)*(good?0.08:0.03));
      if(good)st.iosGood=true;
    }
    if(st.iosOff===null)return;
    a=a+st.iosOff;
  }else if(isAbs||e.absolute===true){st.kind='abs';if(isAbs)st.gotAbs=true;else if(st.gotAbs)return}
  else{if(st.gotAbs)return;st.kind='rel'}
  st.lastSensor=Date.now();
  setTargetFromMatrix(euler(a,b,g));
}
const sensorLive=()=>st.sensorOn&&Date.now()-st.lastSensor<1500;
function attachSensors(){
  if('ondeviceorientationabsolute' in window)window.addEventListener('deviceorientationabsolute',e=>onOrient(e,true),true);
  window.addEventListener('deviceorientation',e=>onOrient(e,false),true);
  st.sensorOn=true;$('sensorBtn').classList.add('on');
  setTimeout(()=>{if(!st.lastSensor)setStatus(L().noSensorData,true)},3000);
}
function updateView(){
  if(!sensorLive())manualTarget();
  if(!target)manualTarget();
  const k=sensorLive()?0.22:0.5;
  let f=norm(view.f.map((v,i)=>v+(target.f[i]-v)*k));
  let u=view.u.map((v,i)=>v+(target.u[i]-v)*k);
  if(dot(view.f,target.f)<0.2){f=target.f.slice();u=target.u.slice()} // กระโดดเมื่อห่างมาก
  const d=dot(u,f);u=norm(u.map((v,i)=>v-d*f[i]));
  view={f,u,r:cross(f,u)};
}

// ---------------- วาด ----------------
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
let F=1,cx=0,cy=0,hits=[];
function proj(v,o){ // คืนค่า [x,y] หรือ null ถ้าอยู่ด้านหลัง
  o=o||0;const x=v[o],y=v[o+1],z=v[o+2];
  const df=view.f[0]*x+view.f[1]*y+view.f[2]*z;if(df<0.02)return null;
  return [cx+F*(view.r[0]*x+view.r[1]*y+view.r[2]*z)/df, cy-F*(view.u[0]*x+view.u[1]*y+view.u[2]*z)/df];
}
function polyline(arr){ // arr = Float64Array xyz
  let started=false;ctx.beginPath();
  for(let j=0;j<arr.length;j+=3){const p=proj(arr,j);if(!p){started=false;continue}if(!started){ctx.moveTo(p[0],p[1]);started=true}else ctx.lineTo(p[0],p[1])}
  ctx.stroke();
}
function polylineArr(list){let s=false;ctx.beginPath();for(const v of list){const p=proj(v);if(!p){s=false;continue}if(!s){ctx.moveTo(p[0],p[1]);s=true}else ctx.lineTo(p[0],p[1])}ctx.stroke()}
function fillPolyClipped(arr){ // ตัดรูปหลายเหลี่ยมด้วยระนาบด้านหน้ากล้องก่อนฉาย (กันภาพเพี้ยน)
  const n=arr.length/3,pts=[];
  for(let j=0;j<n;j++){const x=arr[j*3],y=arr[j*3+1],z=arr[j*3+2];pts.push([dot(view.r,[x,y,z]),dot(view.u,[x,y,z]),dot(view.f,[x,y,z])])}
  const out=[],E=0.05;
  for(let j=0;j<n;j++){const a=pts[j],b=pts[(j+1)%n],ia=a[2]>=E,ib=b[2]>=E;if(ia)out.push(a);if(ia!==ib){const t=(E-a[2])/(b[2]-a[2]);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,E])}}
  if(out.length<3)return;
  ctx.beginPath();out.forEach((p,i)=>{const x=cx+F*p[0]/p[2],y=cy-F*p[1]/p[2];i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fill();
}
let curCon='',centerInfo=null;
function render(){
  const night=redLevel()?1:Math.max(0,Math.min(1,(-sky.sunAlt-0)/12)); // 0=กลางวัน 1=กลางคืน (โหมดแดง = ฟ้ามืดเสมอ)
  F=(H/2)/Math.tan(st.vfov/2*D2R);cx=W/2;cy=H/2;hits=[];
  ctx.clearRect(0,0,W,H);
  if(!st.cam){
    const g=ctx.createLinearGradient(0,0,0,H);
    const top=mix([33,86,150],[4,10,24],night),bot=mix([110,165,220],[12,26,48],night);
    g.addColorStop(0,`rgb(${top})`);g.addColorStop(1,`rgb(${bot})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  const vis=st.cam?0.9:0.35+0.65*night;
  // ทางช้างเผือก
  const mwVis=st.cam?0.6:night;
  if(mwVis>0.05)[0.035,0.045,0.06].forEach((a,i)=>{ctx.fillStyle=`rgba(175,200,255,${a*mwVis})`;for(const p of sky.mw[i])fillPolyClipped(p)});
  // กริด
  if(st.grid){ctx.strokeStyle='rgba(124,200,255,.18)';ctx.lineWidth=1;grid.forEach(polylineArr)}
  // เส้นกลุ่มดาว
  ctx.lineWidth=1;ctx.strokeStyle=`rgba(110,180,255,${0.32*vis+0.1})`;
  conIds.forEach((id,i)=>{if(id!==curCon)sky.lines[i].forEach(polyline)});
  const ci=conIds.indexOf(curCon);
  if(ci>=0){ctx.lineWidth=2;ctx.strokeStyle='rgba(140,210,255,.95)';sky.lines[ci].forEach(polyline)}
  // ชื่อกลุ่มดาว
  ctx.textAlign='center';ctx.textBaseline='middle';
  lblIds.forEach((id,i)=>{
    const isCur=id===curCon;if(!isCur&&CON_INFO[id][3]>2)return;
    const p=proj(sky.lbl,i*3);if(!p||p[0]<-50||p[0]>W+50||p[1]<-20||p[1]>H+20)return;
    ctx.font=isCur?'600 15px system-ui':'12px system-ui';ctx.fillStyle=isCur?'rgba(150,215,255,1)':'rgba(120,175,235,.75)';
    ctx.fillText(conLabel(id),p[0],p[1]);hits.push({x:p[0],y:p[1],type:'con',id,pri:1});
  });
  // ดาวฤกษ์
  const magLim=st.vfov>70?4.3:st.vfov>45?4.8:5.2;
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  for(let i=0;i<NS;i++){
    const m=STARS[i][2];if(m>magLim)break;
    const p=proj(sky.stars,i*3);if(!p||p[0]<-10||p[0]>W+10||p[1]<-10||p[1]>H+10)continue;
    const r=Math.max(0.55,(5.6-m)*0.72)*(st.vfov<40?1.25:1);
    if(m<1.6){ctx.fillStyle='rgba(190,220,255,.16)';ctx.beginPath();ctx.arc(p[0],p[1],r*2.6,0,6.283);ctx.fill()}
    ctx.globalAlpha=Math.min(1,0.35+(magLim-m)*0.3);ctx.fillStyle=starCol[i];ctx.beginPath();ctx.arc(p[0],p[1],r,0,6.283);ctx.fill();ctx.globalAlpha=1;
    const nm=STAR_NAMES[i];
    if(nm){hits.push({x:p[0],y:p[1],type:'star',i,name:nm});if(m<1.6||st.vfov<45){ctx.font='12px system-ui';ctx.fillStyle='rgba(255,240,205,.92)';ctx.fillText(starLabel(nm),p[0]+r+4,p[1]-r-2)}}
  }
  // ดาวเคราะห์/ดวงอาทิตย์/ดวงจันทร์
  for(const b of sky.bodies){
    const p=proj(b.v);if(!p)continue;
    if(b.name==='Sun'){ctx.fillStyle='rgba(255,210,80,.25)';ctx.beginPath();ctx.arc(p[0],p[1],b.r*2.2,0,6.283);ctx.fill()}
    if(b.name==='Moon')drawMoon(p,b.r,b.col);else{ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(p[0],p[1],b.r,0,6.283);ctx.fill()}
    ctx.font='600 13px system-ui';ctx.fillStyle=b.col;ctx.fillText(bn(b.name),p[0]+b.r+5,p[1]+4);
    hits.push({x:p[0],y:p[1],type:'body',b});
  }
  drawGround();
  drawTarget();
}
function drawMoon(p,r,colr){ // วาดเฟสดวงจันทร์แบบง่าย (ข้างขึ้นสว่างด้านขวา)
  const ph=sky.moonPhase,lit=(1-Math.cos(ph*D2R))/2,right=ph<180,ex=r*Math.abs(Math.cos(ph*D2R));
  ctx.fillStyle='rgba(60,64,76,.9)';ctx.beginPath();ctx.arc(p[0],p[1],r,0,6.283);ctx.fill();
  ctx.fillStyle=colr;ctx.beginPath();ctx.arc(p[0],p[1],r,-Math.PI/2,Math.PI/2,!right);
  ctx.ellipse(p[0],p[1],ex,r,0,Math.PI/2,-Math.PI/2,right?(lit<0.5):(lit>=0.5));ctx.fill();
}
function mix(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')}
function drawGround(){
  // จุดบนจอที่ "รังสีมอง" ชี้ต่ำกว่าขอบฟ้า เป็นอสมการเชิงเส้นของ (x,y) → ตัดสี่เหลี่ยมจอด้วยครึ่งระนาบ
  const Ux=view.r[2],Uy=view.u[2],Uz=view.f[2];
  const val=(x,y)=>((x-cx)/F)*Ux-((y-cy)/F)*Uy+Uz; // >0 = เหนือขอบฟ้า
  const rect=[[0,0],[W,0],[W,H],[0,H]],poly=[];
  for(let i=0;i<4;i++){const a=rect[i],b=rect[(i+1)%4],va=val(a[0],a[1]),vb=val(b[0],b[1]);if(va<=0)poly.push(a);if((va<=0)!==(vb<=0)){const t=va/(va-vb);poly.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}
  if(poly.length>=3){ctx.fillStyle=st.cam?'rgba(10,22,14,.35)':'rgba(9,17,13,.93)';ctx.beginPath();poly.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()}
  // เส้นขอบฟ้า + ทิศ
  ctx.strokeStyle='rgba(124,200,255,.7)';ctx.lineWidth=1.3;polylineArr(grid[0]);
  ctx.textAlign='center';
  for(const c of CARD){const p=proj(enuFromAzAlt(c[1],0));if(!p||p[0]<-40||p[0]>W+40)continue;
    ctx.fillStyle='rgba(124,200,255,.95)';ctx.fillRect(p[0]-.75,p[1]-8,1.5,8);
    ctx.font=c[2]?'700 14px system-ui':'600 12px system-ui';ctx.fillText(c[0],p[0],p[1]-13);
    if(c[2]){ctx.font='11px system-ui';ctx.fillStyle='rgba(160,200,240,.85)';ctx.fillText(L().card[c[0]],p[0],p[1]+15)}}
  ctx.textAlign='left';
}

// ---------------- เป้าหมาย / นำทาง ----------------
function targetVec(){
  const t=st.target;if(!t)return null;const [k,id]=t.split(':');
  if(k==='b'){const b=sky.bodies.find(x=>x.name===id);return b?{v:b.v,name:bn(b.name)}:null}
  if(k==='s'){const i=+id;return {v:Array.from(sky.stars.subarray(i*3,i*3+3)),name:starLabel(STAR_NAMES[i])}}
  if(k==='c'){const i=lblIds.indexOf(id);return {v:Array.from(sky.lbl.subarray(i*3,i*3+3)),name:conWord(id)}}
  return null;
}
function drawTarget(){
  const tv=targetVec();if(!tv)return;
  const p=proj(tv.v);const m=40;
  if(p&&p[0]>m&&p[0]<W-m&&p[1]>m&&p[1]<H-m){
    const pulse=1+0.15*Math.sin(Date.now()/250);
    ctx.strokeStyle='#ffd98a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p[0],p[1],18*pulse,0,6.283);ctx.stroke();
  }else{
    // ลูกศรชี้ไปยังเป้าหมายที่ขอบจอ
    const dx=dot(view.r,tv.v),dy=dot(view.u,tv.v),ang=Math.atan2(-dy,dx);
    const R=Math.min(W,H)/2-36,x=cx+Math.cos(ang)*R,y=cy+Math.sin(ang)*R;
    ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle='#ffd98a';ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-8,-11);ctx.lineTo(-3,0);ctx.lineTo(-8,11);ctx.closePath();ctx.fill();ctx.restore();
  }
}
let riseCache={};
function nextRise(v0key){ // หาเวลาที่เป้าหมายจะขึ้นเหนือขอบฟ้า ภายใน 24 ชม. (ไล่ทีละ 10 นาที)
  if(riseCache[v0key]!==undefined)return riseCache[v0key];
  const [k,id]=v0key.split(':');let eq=null;
  if(k==='s')eq=starEQ.subarray(+id*3,+id*3+3);
  else if(k==='c')eq=lblEQ[lblIds.indexOf(id)];
  const base=now().getTime();let res=null;
  for(let m=10;m<=1440;m+=10){
    const t=A.MakeTime(new Date(base+m*60000));let alt;
    if(k==='b'){const e=A.Equator(A.Body[id],t,observer,true,true);alt=A.Horizon(t,observer,e.ra,e.dec,'normal').altitude}
    else{const o=[0,0,0];eqjToEnu(A.Rotation_EQJ_HOR(t,observer).rot,eq,o,0,true);alt=Math.asin(o[2])*R2D}
    if(alt>0){res=new Date(base+m*60000);break}
  }
  return riseCache[v0key]=res;
}
function updateGuide(c){
  const g=$('guide'),tv=targetVec();
  if(!tv){g.style.display='none';return}
  g.style.display='block';
  const t=azAltFromEnu(tv.v),dAz=wrap180(t.az-c.az),dAlt=t.alt-c.alt;
  const T=L(),pos=`<small>${T.realPos(t.az.toFixed(1),t.alt.toFixed(1))}</small>`;
  let below='';
  if(t.alt<0){const r=nextRise(st.target);below=`<small style="color:#ffb38a">${T.belowNow}${r?T.rises(r.toLocaleTimeString(T.locale,{hour:'2-digit',minute:'2-digit'})):''}</small>`}
  if(Math.abs(dAz)<4&&Math.abs(dAlt)<4){g.className='found';g.innerHTML=`${T.found(tv.name)}${pos}${below}`;return}
  g.className='';
  const h=Math.abs(dAz)<2?'':(dAz>0?T.right(Math.round(Math.abs(dAz))):T.left(Math.round(Math.abs(dAz))));
  const v=Math.abs(dAlt)<2?'':(dAlt>0?T.up(Math.round(dAlt)):T.down(Math.round(-dAlt)));
  g.innerHTML=`${[h,v].filter(Boolean).join(' · ')} → <b>${tv.name}</b>${pos}${below}`;
}
function buildTargetList(){
  const sel=$('target'),T=L(),coll=(a,b)=>a[1].localeCompare(b[1],T.locale);sel.innerHTML='';
  {const o=document.createElement('option');o.value='';o.textContent=T.targetPh;sel.appendChild(o)}
  const og=(label,items)=>{const g=document.createElement('optgroup');g.label=label;items.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;g.appendChild(o)});sel.appendChild(g)};
  const two=(x,y)=>x===y?x:`${x} (${y})`;
  og(T.grpBodies,BODIES.map(b=>['b:'+b[0],two(bn(b[0]),b[0])]));
  og(T.grpStars,brightStars.map(i=>['s:'+i,'⭐ '+two(starLabel(STAR_NAMES[i]),STAR_NAMES[i])]).sort(coll));
  og(T.grpCons,lblIds.map(id=>['c:'+id,conHead(id)]).sort(coll));
  sel.value=st.target||'';
}

let lastInfo=0,selected=null;
function updateInfo(){
  const c=azAltFromEnu(view.f);
  const T=L();$('dirPill').innerHTML=T.pill(Math.round(c.az),T.compass[Math.round(c.az/45)%8],Math.round(c.alt));
  // ทิศกลางจอ → RA/Dec (J2000) → Astronomy.Constellation()
  const f=view.f,hx=f[1],hy=-f[0],hz=f[2],m=sky.horEqj;
  const ex=m[0][0]*hx+m[1][0]*hy+m[2][0]*hz,ey=m[0][1]*hx+m[1][1]*hy+m[2][1]*hz,ez=m[0][2]*hx+m[1][2]*hy+m[2][2]*hz;
  const ra=wrap360(Math.atan2(ey,ex)*R2D)/15,dec=Math.asin(Math.max(-1,Math.min(1,ez)))*R2D;
  const con=A.Constellation(ra,dec);curCon=con.symbol;
  if(selected&&Date.now()-selected.t<6000){showSelected();}
  else{
    selected=null;
    $('conName').textContent=conHead(con.symbol);
    let near=null,best=1e9;
    for(const h of hits){if(h.type==='con')continue;const d=Math.hypot(h.x-cx,h.y-cy);if(d<best&&d<90){best=d;near=h}}
    let sub=`RA ${ra.toFixed(2)}h · Dec ${dec.toFixed(1)}°`;
    if(near)sub=T.near+(near.type==='body'?bn(near.b.name):T.starWord(near.name)+(starLabel(near.name)!==near.name?` (${near.name})`:''))+' · '+sub;
    if(c.alt<0)sub=T.belowPoint+sub;
    $('conSub').textContent=sub;
    $('lore').textContent=LORE_I18N[LANG][con.symbol]||T.loreFallback(conWord(con.symbol));
  }
  updateGuide(c);
  if(sky.sunAlt>-6&&!st.cam&&!$('status').dataset.sticky)setStatus(sky.sunAlt>0?T.day:T.dusk);
}
function showSelected(){

  else{const i=s.i,v=azAltFromEnu(sky.stars.subarray(i*3,i*3+3));const cn=A.Constellation(STARS[i][0]/15,STARS[i][1]).symbol;$('conName').textContent='⭐ '+(starLabel(s.name)!==s.name?`${starLabel(s.name)} (${s.name})`:s.name);$('conSub').textContent=`${T.conOf(conWord(cn))} · Azimuth ${v.az.toFixed(1)}° · Altitude ${v.alt.toFixed(1)}° · ${T.mag} ${STARS[i][2]}`;$('lore').textContent=LORE_I18N[LANG][cn]||''}
}
function setStatus(t,warn){const s=$('status');s.textContent=t;s.className=warn?'warn':'';if(warn){s.dataset.sticky='1';setTimeout(()=>delete s.dataset.sticky,8000)}}

// ---------------- GPS ----------------
function requestGPS(){
  if(!navigator.geolocation){setStatus(L().gpsNone,true);return}
  navigator.geolocation.getCurrentPosition(p=>{
    st.lat=p.coords.latitude;st.lon=p.coords.longitude;st.gps=true;observer=new A.Observer(st.lat,st.lon,p.coords.altitude||0);skyDirty=true;
    try{localStorage.setItem('sf_loc',JSON.stringify({lat:st.lat,lon:st.lon}))}catch(e){}
    setStatus(L().gpsOk(st.lat.toFixed(3),st.lon.toFixed(3),Math.round(p.coords.accuracy),sensorText()));
  },err=>{
    const T=L(),why=err.code===1?T.gpsDenied:T.gpsFail;
    setStatus(T.gpsFallback(why,st.lat.toFixed(2),st.lon.toFixed(2)),true);
  },{enableHighAccuracy:true,timeout:15000,maximumAge:300000});
}
const sensorText=()=>{const k=L().sensorKinds;return k[st.kind]||(st.sensorOn?k.wait:k.off)};

  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    v.srcObject=s;st.cam=true;document.body.classList.add('cam');btn.classList.add('on');toast(L().arOn);
  }catch(err){setStatus(L().camFail(err.message),true)}
});

// ---------------- ลากนิ้ว / ซูม / แตะ ----------------
const pts=new Map();let gest=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1)gest={type:'drag',x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,t:Date.now(),moved:0};
  else if(pts.size===2){const [a,b]=[...pts.values()];gest={type:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),fov:st.vfov,moved:99}}});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)||!gest)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gest.type==='pinch'&&pts.size===2){const [a,b]=[...pts.values()];st.vfov=Math.max(18,Math.min(100,gest.fov*gest.d/Math.max(20,Math.hypot(a.x-b.x,a.y-b.y))));return}
  if(gest.type!=='drag')return;
  const dx=e.clientX-gest.lx,dy=e.clientY-gest.ly;gest.lx=e.clientX;gest.ly=e.clientY;gest.moved+=Math.abs(dx)+Math.abs(dy);
  const k=st.vfov/H;
  if(sensorLive()){st.calib=wrap180(st.calib-dx*k);toast(L().calib((st.calib>0?'+':'')+st.calib.toFixed(0)))}
  else{st.manAz=wrap360(st.manAz-dx*k);st.manAlt=Math.max(-89,Math.min(89,st.manAlt+dy*k))}
});
function up(e){pts.delete(e.pointerId);
  if(gest&&gest.type==='drag'&&gest.moved<10&&Date.now()-gest.t<400){
    let best=null,bd=32;for(const h of hits){const d=Math.hypot(h.x-e.clientX,h.y-e.clientY)+(h.pri?8:0);if(d<bd){bd=d;best=h}}
    if(best){if(best.type!=='con'){selected={...best,t:Date.now()};showSelected()}openStoryFor(best)}
  }
  if(pts.size===0)gest=null;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();st.vfov=Math.max(18,Math.min(100,st.vfov*(e.deltaY>0?1.08:0.93)))},{passive:false});

// ---------------- ตำนานดาว + อ่านออกเสียง ----------------
let storyCtx=null; // {parts, target}
const GENERIC_KEYS=['GENERIC','ANCIENT','DUTCH','LACAILLE','HEVELIUS'];
function storyForCon(id,leadIn){
  const key=(CON_MYTH[id]||['GENERIC'])[0],base=MY[LANG][key]||MY[LANG].GENERIC,T=L();
  const extra=LANG==='th'?(CON_MYTH[id]||[])[1]:LEADS[LANG][id];
  const generic=GENERIC_KEYS.includes(key),lat=latin(id);
  const parts=[];if(leadIn)parts.push(leadIn);if(extra)parts.push(extra);
  if(generic&&!extra&&LORE_I18N[LANG][id])parts.push(LORE_I18N[LANG][id]);
  parts.push(...base.p);
  return {title:generic?T.storyGenericTitle(id,lat):base.t,sub:T.storySub(id,lat)+(generic?' · '+base.t:''),parts,target:'c:'+id};
}
function openStoryFor(h){
  let s;const T=L();
  if(h.type==='body'){const b=BODYM[LANG][h.b.name];s={title:b.t,sub:LANG==='en'?h.b.name:`${bn(h.b.name)} (${h.b.name})`,parts:b.p.slice(),target:'b:'+h.b.name}}
  else if(h.type==='star'){const cn=A.Constellation(STARS[h.i][0]/15,STARS[h.i][1]).symbol;s=storyForCon(cn,T.starLead(starLabel(h.name),conWord(cn)));s.sub=T.starSub(starLabel(h.name),h.name)+s.sub}
  else s=storyForCon(h.id);
  s.src=h;showStory(s);
}
function showStory(s){
  ttsStop();storyCtx=s;
  $('stTitle').textContent=s.title;$('stSub').textContent=s.sub;
  const body=$('stBody');body.innerHTML='';
  s.parts.forEach((t,i)=>{const sp=document.createElement('span');sp.textContent=t+(LANG==='zh'?'':' ');sp.dataset.i=i;sp.addEventListener('click',()=>ttsStart(i));body.appendChild(sp)});
  body.scrollTop=0;
  const el=$('story');el.classList.add('open');el.setAttribute('aria-hidden','false');
  updateVoiceNote();
}
function closeStory(){ttsStop();const el=$('story');el.classList.remove('open');el.setAttribute('aria-hidden','true')}
$('stClose').addEventListener('click',closeStory);
$('storyBtn').addEventListener('click',()=>{
  if(selected&&Date.now()-selected.t<6000){openStoryFor(selected);return}
  if(curCon)openStoryFor({type:'con',id:curCon});
});
$('stFind').addEventListener('click',()=>{if(!storyCtx)return;st.target=storyCtx.target;$('target').value=storyCtx.target;riseCache={};closeStory();toast(L().navToast)});
// Text-to-Speech (Web Speech API) อ่านทีละประโยค เพื่อไม่ให้ iOS/Chrome ตัดเสียงกลางคัน
const TTS={ok:'speechSynthesis' in window,voice:null,run:0,idx:0,playing:false,rate:0.95};
const VOICE_PREF={th:[/^th([-_]|$)/i],en:[/^en[-_]US/i,/^en[-_]GB/i,/^en([-_]|$)/i],zh:[/^zh[-_](CN|Hans)/i,/^cmn/i,/^zh[-_]TW/i,/^zh([-_]|$)/i]};
function pickVoice(){if(!TTS.ok)return;const vs=speechSynthesis.getVoices();TTS.voice=null;
  for(const re of VOICE_PREF[LANG]){const c=vs.filter(v=>re.test(v.lang));if(c.length){TTS.voice=c.find(v=>v.localService)||c[0];break}}
  if(!TTS.voice&&LANG==='th')TTS.voice=vs.find(v=>/thai|ไทย/i.test(v.name))||null;
  updateVoiceNote()}
if(TTS.ok){pickVoice();speechSynthesis.addEventListener?speechSynthesis.addEventListener('voiceschanged',pickVoice):(speechSynthesis.onvoiceschanged=pickVoice)}
function updateVoiceNote(){
  const n=$('stVoiceNote');if(!n)return;
  if(!TTS.ok){n.textContent=L().ttsNone;return}
  if(!TTS.voice&&speechSynthesis.getVoices().length)n.textContent=L().noVoice;
  else n.textContent='';
}
function highlight(i){$('stBody').querySelectorAll('span').forEach(sp=>sp.classList.toggle('reading',+sp.dataset.i===i));const cur=$('stBody').querySelector('span.reading');if(cur)cur.scrollIntoView({block:'nearest',behavior:'smooth'})}
function setSpeakBtn(){const b=$('stSpeak');b.classList.toggle('playing',TTS.playing);b.textContent=TTS.playing?L().stop:L().speak}
function ttsStart(from){
  if(!TTS.ok||!storyCtx){setStatus(L().ttsNone,true);return}
  speechSynthesis.cancel();
  const run=++TTS.run;TTS.idx=from||0;TTS.playing=true;setSpeakBtn();
  const lines=[storyCtx.title,...storyCtx.parts];let k=from?from+1:0; // บรรทัด 0 = ชื่อเรื่อง
  const next=()=>{
    if(run!==TTS.run)return;
    if(k>=lines.length){TTS.playing=false;setSpeakBtn();highlight(-1);return}
    const u=new SpeechSynthesisUtterance(lines[k]);u.lang=L().tts;if(TTS.voice)u.voice=TTS.voice;u.rate=TTS.rate;u.pitch=1;
    highlight(k-1);
    u.onend=()=>{if(run!==TTS.run)return;k++;setTimeout(next,180)};
    u.onerror=ev=>{if(run!==TTS.run)return;if(ev.error==='interrupted'||ev.error==='canceled')return;k++;setTimeout(next,180)};
    speechSynthesis.speak(u);
  };
  next();
  // กัน Chrome Android หยุดเงียบ ๆ เมื่อพูดนาน
  clearInterval(TTS.keep);TTS.keep=setInterval(()=>{if(run!==TTS.run||!TTS.playing){clearInterval(TTS.keep);return}if(speechSynthesis.paused)speechSynthesis.resume()},4000);
}
function ttsStop(){TTS.run++;TTS.playing=false;if(TTS.ok)speechSynthesis.cancel();setSpeakBtn();highlight(-1)}
$('stSpeak').addEventListener('click',()=>{TTS.playing?ttsStop():ttsStart(0)});
$('stRate').addEventListener('click',e=>{const slow=TTS.rate>0.9;TTS.rate=slow?0.75:0.95;e.currentTarget.textContent=slow?L().normal:L().slow;e.currentTarget.classList.toggle('on',slow);if(TTS.playing){const i=Math.max(0,+(($('stBody').querySelector('span.reading')||{}).dataset||{}).i||0);ttsStart(i)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)ttsStop()});

// ---------------- ลูป ----------------
window.addEventListener('resize',resize);
// ---------------- ภาษา / Language / 语言 ----------------
function applyLang(l,silent){
  LANG=LANGS.includes(l)?l:'th';try{localStorage.setItem('sf_lang',LANG)}catch(e){}
  const T=L();document.documentElement.lang=LANG==='zh'?'zh-CN':LANG;document.title=T.title;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=T[el.dataset.i18n]});
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{el.innerHTML=T[el.dataset.i18nHtml]});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{el.setAttribute('aria-label',T[el.dataset.i18nAria])});
  $('langBtn').textContent=T.code;
  document.querySelectorAll('.langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
  $('introWarn').textContent=window.isSecureContext?'':T.insecure;
  buildTargetList();setRed(redLevel(),true);setTime(st.timeOffsetMin);
  if(TTS.ok){ttsStop();pickVoice()}setSpeakBtn();$('stRate').textContent=TTS.rate>0.9?T.slow:T.normal;
  if($('story').classList.contains('open')&&storyCtx&&storyCtx.src)openStoryFor(storyCtx.src);
  if(selected)selected.t=0;lastInfo=0;$('status').textContent='';delete $('status').dataset.sticky;
  if(!silent)toast(T.name);
}
$('langBtn').addEventListener('click',()=>applyLang(LANGS[(LANGS.indexOf(LANG)+1)%LANGS.length]));
document.querySelectorAll('.langSeg button').forEach(b=>b.addEventListener('click',()=>applyLang(b.dataset.lang)));
resize();computeSky();manualTarget();view={...target};
applyLang(LANG,true);
setStatus(L().initStatus(st.lat.toFixed(2),st.lon.toFixed(2)));
function frame(){
  requestAnimationFrame(frame);
  try{
    if(skyDirty||Date.now()-lastSky>2000)computeSky();
    updateView();render();
    if(Date.now()-lastInfo>200){lastInfo=Date.now();updateInfo()}
  }catch(err){console.error(err)}
}
frame();
window.__sf={st,view:()=>view,sky:()=>sky,setTargetFromMatrix,euler,onOrient}; // สำหรับทดสอบ
})();
</script>
<div id="redFilter"></div>
